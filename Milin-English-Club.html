<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Milin English Club">
<meta name="theme-color" content="#FFF1DE">
<title>Milin English Club</title>
<!--
  ═══════════════════════════════════════════════════════════════════════
  MILIN ENGLISH CLUB — เกมฝึกภาษาอังกฤษ 15 เกม (iPad แนวนอน)
  ไฟล์เดียวจบ · ไม่ต้องต่อเน็ต · อัปโหลดขึ้นเว็บได้เลย
  โครง: 1 CSS · 2 CONTENT · 3 PHONICS · 4 VOICE · 5 CORE · 6 GAMES · 7 BOOT
  ═══════════════════════════════════════════════════════════════════════
-->
<style>
/* ═════════ 1. CSS ═════════ */
:root{
  --cream:#FFF6E9; --ink:#3B2E26; --ink2:#7C6553; --ink3:#AB9683;
  --line:#EFE0CC; --card:#FFFFFF; --shadow:#E3CDB2;

  --orange:#F2622F; --orange-t:#FFE2D3; --orange-d:#C4441A;
  --teal:#12A08A;   --teal-t:#CDF2EA;   --teal-d:#0A7A68;
  --blue:#3B7BEA;   --blue-t:#D8E5FF;   --blue-d:#2557B8;
  --purple:#9B54DE; --purple-t:#EBDCFC; --purple-d:#7737B8;
  --gold:#E39100;   --gold-t:#FFEDC7;   --gold-d:#B36F00;
  --pink:#E5407A;   --pink-t:#FFDCE7;   --pink-d:#B72656;
  --cyan:#1AA7C6;   --cyan-t:#D2F0F8;   --cyan-d:#0E7F99;
  --lime:#6FA82A;   --lime-t:#E4F4CC;   --lime-d:#527F16;
  --grape:#6A5AE0;  --grape-t:#E1DDFF;  --grape-d:#4B3CC0;
  --coral:#EF5D8E;  --coral-t:#FFDEEA;  --coral-d:#C23A69;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:"SF Pro Rounded","Noto Sans Thai","Sukhumvit Set",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color:var(--ink);background:var(--cream);
  -webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;text-align:inherit}
/* พื้นหลังลายจุดนุ่มๆ */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 8% 6%,  rgba(242,98,47,.16) 0, transparent 26%),
    radial-gradient(circle at 94% 10%, rgba(59,123,234,.15) 0, transparent 24%),
    radial-gradient(circle at 88% 92%, rgba(18,160,138,.15) 0, transparent 26%),
    radial-gradient(circle at 12% 90%, rgba(229,64,122,.13) 0, transparent 24%),
    linear-gradient(170deg,#FFF9EF 0%,#FFF4E4 45%,#FFF0F2 100%);
}
/* เวทีขนาดคงที่ 1194×834 (iPad แนวนอน) แล้วย่อ/ขยายให้พอดีจอที่เปิด
   → หน้าตาเหมือนกันทุกเครื่อง ทั้งบน iPad, คอม และตอนอัปโหลดขึ้นเว็บ */
#fit{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
#app{width:1194px;height:834px;flex:0 0 auto;transform-origin:center center;
  display:flex;flex-direction:column;position:relative}

/* ---------- top bar ---------- */
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:12px 24px 6px}
.iconbtn{width:56px;height:56px;border-radius:20px;background:#fff;box-shadow:0 5px 0 var(--shadow);
  display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto;transition:transform .1s}
.iconbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
.titles{display:flex;flex-direction:column;min-width:0}
.t1{font-size:31px;font-weight:900;letter-spacing:-.3px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:16px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1 1 auto}
.pill{display:flex;align-items:center;gap:8px;background:#fff;border-radius:18px;padding:9px 15px;
  box-shadow:0 4px 0 var(--shadow);font-size:15px;font-weight:600;color:var(--ink2);white-space:nowrap}
.pill b{color:var(--ink);font-weight:800;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.stars{display:flex;align-items:center;gap:7px;background:#fff;border-radius:18px;padding:9px 17px;
  box-shadow:0 4px 0 var(--shadow);font-size:21px;font-weight:900;color:var(--gold)}
/* ปุ่มปรับความเร็วเสียง — เห็นตลอดทุกหน้าจอ */
.speed{display:flex;align-items:center;gap:0;background:#fff;border-radius:18px;padding:5px;box-shadow:0 4px 0 var(--shadow)}
.speed b{font-size:13px;font-weight:800;color:var(--ink3);padding:0 8px 0 6px;letter-spacing:.2px}
.speed button{padding:7px 12px;border-radius:14px;font-size:16px;font-weight:800;color:var(--ink2);transition:transform .08s}
.speed button.on{background:var(--cyan);color:#fff}
.speed button:active{transform:scale(.93)}

.stage{flex:1 1 auto;min-height:0;padding:6px 24px 18px;display:flex;flex-direction:column}

/* ---------- building blocks ---------- */
.card{background:var(--card);border-radius:28px;border:3px solid var(--line);padding:18px;
  box-shadow:0 6px 0 rgba(227,205,178,.5)}
.soft{background:#FFFCF5;border-radius:22px;border:3px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:20px;
  padding:14px 24px;font-size:19px;font-weight:800;color:#fff;background:var(--orange);
  box-shadow:0 5px 0 var(--orange-d);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--orange-d)}
.btn.sm{padding:10px 17px;font-size:16px;border-radius:16px}
.btn.lg{padding:18px 34px;font-size:23px;border-radius:24px}
.btn.ghost{background:#fff;color:var(--ink2);box-shadow:0 5px 0 var(--shadow)}
.btn.ghost:active{box-shadow:0 1px 0 var(--shadow)}
.chip{border-radius:16px;padding:9px 16px;font-size:16px;font-weight:800;background:#fff;color:var(--ink2);
  border:3px solid var(--line);transition:transform .08s;white-space:nowrap}
.chip:active{transform:scale(.95)}
.chip.on{color:#fff}

/* ---------- home grid ---------- */
.hero{display:flex;align-items:center;gap:16px;padding:0 4px 10px;flex:0 0 auto}
.hero .cat{font-size:50px;line-height:1}
.hero h2{font-size:25px;font-weight:900;line-height:1.2}
.hero h2 em{font-style:normal;color:var(--orange)}
.hero p{font-size:15.5px;font-weight:600;color:var(--ink2);margin-top:1px}
.grid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);
  gap:13px;overflow:hidden}
.gcard{position:relative;border-radius:24px;background:#fff;border:3px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 8px 14px;
  overflow:hidden;transition:transform .1s;min-height:0}
.gcard:active{transform:translateY(5px)}
.gcard .disc{width:60px;height:60px;border-radius:22px;display:flex;align-items:center;justify-content:center;
  font-size:32px;margin-bottom:5px;box-shadow:0 4px 0 rgba(0,0,0,.14)}
.gcard .en{font-size:18.5px;font-weight:900;line-height:1.1;letter-spacing:-.2px}
.gcard .th{font-size:14.5px;font-weight:800;color:var(--ink2);line-height:1.2}
.gcard .bar{position:absolute;left:0;right:0;bottom:0;height:7px}
.gcard .n{position:absolute;top:9px;right:11px;font-size:11.5px;font-weight:800;color:#fff;
  padding:3px 8px;border-radius:9px;opacity:.92}

/* ---------- word pieces ---------- */
.wordbox{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.part{border-radius:20px;padding:12px 20px;font-weight:900;line-height:1;
  display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .1s;font-size:46px}
.part:active{transform:scale(.94)}
.part small{font-size:14px;font-weight:800;opacity:.72;letter-spacing:.3px}
.op{font-size:32px;font-weight:900;color:var(--ink3)}
.tile{width:72px;height:76px;border-radius:20px;display:flex;align-items:center;justify-content:center;
  font-size:38px;font-weight:900;transition:transform .1s}
.tile:active{transform:scale(.93)}
.slot{width:72px;height:76px;border-radius:20px;border:3px dashed var(--line);display:flex;
  align-items:center;justify-content:center;font-size:38px;font-weight:900}

/* ---------- lists / options ---------- */
.rowlist{display:flex;flex-direction:column;gap:9px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.opt{display:flex;align-items:center;gap:12px;border-radius:20px;border:3px solid var(--line);
  background:#FFFCF5;padding:13px 17px;font-size:20px;font-weight:800;transition:transform .08s}
.opt:active{transform:scale(.985)}
.opt .badge{width:34px;height:34px;border-radius:12px;background:#E2D2BE;color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:17px;font-weight:900;flex:0 0 auto}
.opt .th{font-size:14.5px;color:var(--ink3);font-weight:700}
.msg{font-size:18px;font-weight:800;min-height:26px}

/* ---------- story ---------- */
.story{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  font-size:26px;line-height:1.8;padding:4px 4px;font-weight:600}
.sline{border-radius:14px;padding:3px 8px;margin-bottom:2px}
.sline.on{background:var(--gold-t)}
.w{border-radius:9px;padding:1px 3px;display:inline-block}
.w.hasdef{border-bottom:3px solid #F3C9A8}
.w.on{background:var(--orange-t)}

/* ---------- scene ---------- */
.scene{position:relative;flex:1 1 auto;min-height:0;border-radius:24px;overflow:hidden;border:3px solid var(--line)}
.obj{position:absolute;line-height:1;transition:filter .2s}
.obj:active{filter:brightness(1.15)}

/* ---------- race ---------- */
.lane{position:relative;height:100%;border-radius:16px;background:#FFFCF5;border:3px solid var(--line);overflow:hidden}
.lane .road{position:absolute;left:0;right:0;top:50%;height:5px;transform:translateY(-50%);
  background:repeating-linear-gradient(90deg,#EFE0CC 0 20px,transparent 20px 40px)}
.car{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:34px;transition:left .5s cubic-bezier(.34,1.3,.64,1)}
.lanename{position:absolute;left:12px;top:5px;font-size:13px;font-weight:900}
.flag{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:22px;opacity:.5}

/* ---------- animations ---------- */
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.09)}100%{transform:scale(1);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,255,255,0))}50%{filter:drop-shadow(0 0 14px rgba(255,214,0,.9))}}
.pop{animation:pop .4s}.bob{animation:bob 1.7s ease-in-out infinite}
.shake{animation:shake .5s}.float{animation:float 3.4s ease-in-out infinite}
.glow{animation:glow 1.4s ease-in-out infinite}

/* ---------- modal ---------- */
.sheet{position:fixed;inset:0;background:rgba(59,46,38,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.sheetbox{width:min(720px,92vw);max-height:88vh;overflow-y:auto;background:var(--cream);border-radius:32px;
  padding:26px;box-shadow:0 22px 55px rgba(59,46,38,.3)}
.field{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.field label{width:172px;font-size:17px;font-weight:800;color:var(--ink2);flex:0 0 auto}
.field input[type=text],.field select{flex:1;font:inherit;font-size:17px;font-weight:700;padding:11px 14px;
  border-radius:15px;border:3px solid var(--line);background:#fff;color:var(--ink);min-width:0}
.field input[type=range]{flex:1;accent-color:var(--orange)}
.switch{width:64px;height:34px;border-radius:17px;background:#E2D2BE;position:relative;transition:background .2s;flex:0 0 auto}
.switch.on{background:var(--teal)}
.switch i{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:14px;background:#fff;transition:left .2s}
.switch.on i{left:33px}

/* ---------- helpers ---------- */
.scrollx{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:3px;flex:0 0 auto}
.scrollx::-webkit-scrollbar,.rowlist::-webkit-scrollbar,.story::-webkit-scrollbar,
.sheetbox::-webkit-scrollbar,.wallbox::-webkit-scrollbar{height:6px;width:6px}
.scrollx::-webkit-scrollbar-thumb,.rowlist::-webkit-scrollbar-thumb,.story::-webkit-scrollbar-thumb,
.sheetbox::-webkit-scrollbar-thumb,.wallbox::-webkit-scrollbar-thumb{background:#E2D2BE;border-radius:3px}
.hint{font-size:15px;font-weight:600;color:var(--ink3)}
.center{display:flex;align-items:center;justify-content:center}
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.wrap{flex-wrap:wrap}
.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g16{gap:16px}
.f1{flex:1 1 auto;min-height:0;min-width:0}
.f0{flex:0 0 auto}
.tc{text-align:center}
</style>
</head>
<body>
<div id="bg"></div>
<div id="fit">
<div id="app">
  <div class="topbar">
    <button class="iconbtn" data-act="home" id="homeBtn">🏠</button>
    <div class="titles">
      <div class="t1" id="scrTitle">Milin English Club</div>
      <div class="t2" id="scrSub">ห้องเรียนภาษาอังกฤษแสนสนุก</div>
    </div>
    <div class="spacer"></div>
    <div class="speed" id="speedBox"></div>
    <button class="pill" data-act="langtog" id="langPill" title="สลับโหมดอังกฤษล้วน / มีคำแปลไทย">🌐 <b>EN</b></button>
    <button class="pill" data-act="testvoice">🎙️ <b id="voicePill">ครูผู้หญิง</b></button>
    <div class="stars">⭐ <span id="starCount">0</span></div>
    <button class="iconbtn" data-act="settings">⚙️</button>
  </div>
  <div class="stage" id="stage"></div>
</div>
</div>
<div id="modal"></div>

<script>
"use strict";
/* ═════════════════════════════════════════════════════════════════════
   2. CONTENT — เนื้อหาทั้งหมดจากชีทของน้องมิลิน (39 ใบ)
   ═════════════════════════════════════════════════════════════════════ */

/* ---- 2.1 ตระกูลคำ (Word Families) ---- */
const FAMILIES = [
  { key:'ad', label:'-ad', unit:'Unit 1', color:'orange', words:[
    {w:'sad', on:'s', th:'เศร้า, เสียใจ', emoji:'😢', sent:'The girl is sad.',        sentTh:'เด็กผู้หญิงเศร้า'},
    {w:'dad', on:'d', th:'พ่อ',            emoji:'👨‍👧', sent:'I will tell my dad!',   sentTh:'ฉันจะไปบอกพ่อ'},
    {w:'bad', on:'b', th:'ไม่ดี, ซน',      emoji:'😠', sent:"You're so bad!",          sentTh:'เธอซนมากเลย'},
    {w:'mad', on:'m', th:'โกรธ',           emoji:'😤', sent:"I'm so mad!",             sentTh:'ฉันโกรธมาก'}
  ]},
  { key:'am', label:'-am', unit:'Unit 1', color:'teal', words:[
    {w:'yam', on:'y', th:'มันเทศ',    emoji:'🍠', sent:'Where is the yam?',      sentTh:'มันเทศอยู่ไหน'},
    {w:'jam', on:'j', th:'แยม',       emoji:'🍓', sent:'Who put jam on my cap?', sentTh:'ใครเอาแยมมาป้ายหมวกฉัน'},
    {w:'dam', on:'d', th:'เขื่อน',    emoji:'🌊', sent:'The dam holds water.',   sentTh:'เขื่อนกักน้ำเอาไว้'},
    {w:'ram', on:'r', th:'แกะตัวผู้', emoji:'🐏', sent:'The ram has a cookie.',  sentTh:'แกะตัวผู้มีคุกกี้'}
  ]},
  { key:'ap', label:'-ap', unit:'Unit 1', color:'blue', words:[
    {w:'cap', on:'c', th:'หมวกแก๊ป', emoji:'🧢', sent:'Jam on my cap!',                sentTh:'แยมเปื้อนหมวกฉัน'},
    {w:'map', on:'m', th:'แผนที่',   emoji:'🗺️', sent:'On the map? No, on the desk!',  sentTh:'บนแผนที่เหรอ? ไม่ใช่ บนโต๊ะ!'},
    {w:'nap', on:'n', th:'งีบหลับ',  emoji:'😴', sent:'The ram naps under the desk.',  sentTh:'แกะงีบหลับใต้โต๊ะ'},
    {w:'tap', on:'t', th:'ก๊อกน้ำ',  emoji:'🚰', sent:'Turn off the tap.',             sentTh:'ปิดก๊อกน้ำด้วย'}
  ]},
  { key:'ag', label:'-ag', unit:'Unit 2', color:'purple', words:[
    {w:'bag', on:'b', th:'กระเป๋า',       emoji:'🎒', sent:'A man has a can in his bag.', sentTh:'ผู้ชายมีกระป๋องอยู่ในกระเป๋า'},
    {w:'wag', on:'w', th:'กระดิก (หาง)',  emoji:'🐕', sent:'The dog can wag its tail.',   sentTh:'สุนัขกระดิกหางได้'},
    {w:'tag', on:'t', th:'ป้าย, วิ่งไล่จับ', emoji:'🏷️', sent:'Tag! You are it!',       sentTh:'แต๊ะ! ตาเธอเป็นคนไล่'},
    {w:'rag', on:'r', th:'ผ้าขี้ริ้ว',    emoji:'🧽', sent:'Clean it with a rag.',        sentTh:'เช็ดด้วยผ้าขี้ริ้ว'}
  ]},
  { key:'an', label:'-an', unit:'Unit 2', color:'gold', words:[
    {w:'man', on:'m', th:'ผู้ชาย',   emoji:'👨', sent:'The man looks at the rat.', sentTh:'ผู้ชายมองไปที่หนู'},
    {w:'can', on:'c', th:'กระป๋อง',  emoji:'🥫', sent:'A rat sits in the can.',    sentTh:'หนูนั่งอยู่ในกระป๋อง'},
    {w:'van', on:'v', th:'รถตู้',    emoji:'🚐', sent:'The van is green.',         sentTh:'รถตู้สีเขียว'},
    {w:'fan', on:'f', th:'พัดลม',    emoji:'🌀', sent:'Turn on the fan.',          sentTh:'เปิดพัดลมหน่อย'}
  ]},
  { key:'at', label:'-at', unit:'Unit 2 · SRA', color:'pink', words:[
    {w:'cat', on:'c', th:'แมว',          emoji:'🐱', sent:'The cat was hungry.',     sentTh:'แมวตัวนั้นหิว'},
    {w:'bat', on:'b', th:'ค้างคาว, ไม้ตี', emoji:'🦇', sent:'The bat is black.',      sentTh:'ค้างคาวสีดำ'},
    {w:'rat', on:'r', th:'หนู',          emoji:'🐀', sent:'The rat is fat.',         sentTh:'หนูตัวอ้วน'},
    {w:'mat', on:'m', th:'เสื่อ',        emoji:'🧶', sent:'The cat slept on a mat.', sentTh:'แมวนอนบนเสื่อ'},
    {w:'fat', on:'f', th:'อ้วน',         emoji:'🐖', sent:'The rat is fat.',         sentTh:'หนูตัวอ้วน'},
    {w:'sat', on:'s', th:'นั่ง (อดีตของ sit)', emoji:'🪑', sent:'Malik and Jeffrey sat under a tree.', sentTh:'มาลิกกับเจฟฟรีย์นั่งใต้ต้นไม้'},
    {w:'hat', on:'h', th:'หมวก',         emoji:'🎩', sent:'I have a red hat.',       sentTh:'ฉันมีหมวกสีแดง'}
  ]},
  { key:'ed', label:'-ed', unit:'Unit 3', color:'orange', words:[
    {w:'bed', on:'b', th:'เตียงนอน', emoji:'🛏️', sent:'Baby chicks are on the bed.', sentTh:'ลูกเจี๊ยบอยู่บนเตียง'},
    {w:'red', on:'r', th:'สีแดง',    emoji:'🟥', sent:'Red hen has ten eggs.',       sentTh:'แม่ไก่สีแดงมีไข่สิบฟอง'},
    {w:'wed', on:'w', th:'แต่งงาน',  emoji:'💒', sent:'They will wed in June.',      sentTh:'พวกเขาจะแต่งงานเดือนมิถุนายน'},
    {w:'Ted', on:'T', th:'เท็ด (ชื่อคน)', emoji:'🧑', sent:'Ted is my friend.',      sentTh:'เท็ดเป็นเพื่อนของฉัน'}
  ]},

function phon(p){ return PHON[p] || PHON[String(p).toLowerCase()] || ['', p, '']; }
const ipaOf = p => phon(p)[0];
const sayOf = p => phon(p)[1];
const exOf  = p => phon(p)[2];
const thSnd = p => (TH_SOUND[p] || TH_SOUND[String(p).toLowerCase()] || ['',''])[0];
const thTip = p => (TH_SOUND[p] || TH_SOUND[String(p).toLowerCase()] || ['',''])[1];
/* แยกคำเป็นชิ้นเสียง — ไม่ระบุ = แยกทีละตัวอักษร */
function pieces(word, given){
  const src = (given && given.length) ? given : String(word).split('');
  return src.map(p => ({t:p, ipa:ipaOf(p), say:sayOf(p)}));
}
/* rime ของคำในตระกูล: ใช้ w.ri ถ้ามี ไม่งั้นใช้ key ของตระกูล */

const FEMALE_HINTS = ['samantha','karen','moira','tessa','fiona','serena','allison','ava','susan','nicky',
  'kate','martha','zira','aria','jenny','michelle','google us english','google uk english female','female','woman'];
const MALE_RE = /male|david|daniel|alex|fred|george|james|mark|guy|arthur|oliver|rishi|tom|aaron|gordon|eddy|reed|rocko|grandpa|ryan/i;

const Voice = {
  list:[], picked:null,
  refresh(){
    try{ this.list = (window.speechSynthesis.getVoices()||[]).filter(v=>/^en(-|_)/i.test(v.lang||'')); }
    catch(e){ this.list = []; }
    if (S.voiceURI){
      const forced = this.list.find(v=>v.voiceURI===S.voiceURI);
      if (forced){ this.picked=forced; this.paint(); return; }
    }
    let pick=null;
    for (const hint of FEMALE_HINTS){ pick=this.list.find(v=>(v.name||'').toLowerCase().includes(hint)); if(pick)break; }
    if(!pick) pick=this.list.find(v=>!MALE_RE.test(v.name||''));
    if(!pick) pick=this.list[0]||null;
    this.picked=pick; this.paint();
  },
  paint(){
    const el=document.getElementById('voicePill'); if(!el) return;
    el.textContent = this.picked
      ? 'ครู ' + this.picked.name.replace(/Microsoft |Google |Online.*|\(.*?\)/g,'').trim()
      : 'ยังไม่มีเสียง';
  },
  utter(text, rate, pitch){
    try{
      const u=new SpeechSynthesisUtterance(String(text));
      if(this.picked){ u.voice=this.picked; u.lang=this.picked.lang; } else u.lang='en-US';
      u.rate  = rate!=null ? rate : S.rate;
      u.pitch = pitch!=null ? pitch : 1.22;
      window.speechSynthesis.speak(u);
      return u;
    }catch(e){ return null; }
  },
  stop(){ try{ window.speechSynthesis.cancel(); }catch(e){} },
  say(text, rate){ this.stop(); return this.utter(text, rate!=null?rate*S.rate/0.85:undefined); },
  /* พูดต่อกันเป็นลำดับ พร้อม callback ทีละชิ้น */
  sequence(items, onStep, onDone){
    this.stop();
    let i=0;
    const step=()=>{
      if(i>=items.length){ if(onDone) onDone(); return; }
      const it=items[i];
      if(onStep) onStep(i,it);
      const u=this.utter(it.text, it.rate);
      if(!u){ i++; setTimeout(step,260); return; }
      u.onend  =()=>{ i++; setTimeout(step, it.gap!=null?it.gap:180); };
      u.onerror=()=>{ i++; setTimeout(step,200); };
    };
    step();
  },
  /* ★ หัวใจ: ออกเสียงโฟนิกส์  c … at … c-at … cat ★ */
  phonics(word, parts, onStep, onDone){
    const ps=pieces(word,parts);
    const slow=Math.max(.3, S.rate-.30), mid=Math.max(.3, S.rate-.32), full=Math.max(.4, S.rate-.06);
    const seq=ps.map(p=>({text:p.say, rate:slow, gap:Math.round(250/S.rate)}));
    seq.push({text:ps.map(p=>p.say).join(' '), rate:mid, gap:Math.round(280/S.rate)});
    seq.push({text:word, rate:full, gap:0});
    this.sequence(seq,onStep,onDone);
  }
};

/* สลับตัวเลือกแบบคงที่ต่อข้อ (ไม่เด้งตอน re-render) แต่กระจายดี */
function shuffleStable(arr, seed){
  const b=arr.slice();
  let t=(seed+1)>>>0;
  t=Math.imul(t^(t>>>16),0x45D9F3B)>>>0; t=Math.imul(t^(t>>>16),0x45D9F3B)>>>0; t=(t^(t>>>16))>>>0;
  const rnd=()=>{ t=(t+0x6D2B79F5)>>>0; let x=Math.imul(t^(t>>>15),1|t); x=(x+Math.imul(x^(x>>>7),61|x))^x;
    return ((x^(x>>>14))>>>0)/4294967296; };
  for(let i=b.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; }
  return b;
}

      </div>
    </div>
  </div>`;
};
ACT.pfam =d=>{ S.famIdx=+d.i; S.wordIdx=0; render(); const f=FAMILIES[S.famIdx]; Voice.say(sayOf(f.key),0.5); };
ACT.pword=d=>{ S.wordIdx=+d.i; render(); const f=FAMILIES[S.famIdx],w=f.words[S.wordIdx];
  Voice.phonics(w.w,[w.on,rimeOf(w,f)]); };
ACT.pprev=()=>{ const n=FAMILIES[S.famIdx].words.length; S.wordIdx=(S.wordIdx-1+n)%n; render(); };
ACT.pnext=()=>{ const n=FAMILIES[S.famIdx].words.length; S.wordIdx=(S.wordIdx+1)%n; render(); };

/* ---------- 6.2 SOUND WALL (ตารางเสียงโฟนิกส์ครบชุด) ---------- */
VIEWS.wall = ()=>{
  const grp=WALL[S.wallIdx], col=C(grp.color), tint=C(grp.color+'-t'), dark=C(grp.color+'-d');
  const sel=S.wallKey||grp.keys[0];
  const p=phon(sel);
  return `
  <div class="scrollx" style="margin-bottom:9px">
    ${WALL.map((g,i)=>`<button class="chip ${i===S.wallIdx?'on':''}"
      style="${i===S.wallIdx?`background:${C(g.color)};border-color:${C(g.color)}`:`color:${C(g.color+'-d')};border-color:${C(g.color+'-t')}`}"
      data-act="wallgrp" data-i="${i}">${esc(g.label)}</button>`).join('')}
  </div>
  <div class="row g16 f1" style="align-items:stretch">
    <div class="card f1" style="border-color:${tint};overflow-y:auto;-webkit-overflow-scrolling:touch"
      ><div class="hint" style="margin-bottom:8px">${esc(grp.th)} — แตะทีละช่องเพื่อฟังเสียงที่ถูกต้อง</div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:9px">
        ${grp.keys.map(k=>{
          const on=k===sel, ph=phon(k);
          return `<button data-act="wallkey" data-k="${esc(k)}"
            style="border-radius:18px;padding:9px 4px;border:3px solid ${on?col:tint};background:${on?tint:'#FFFCF5'};
                   display:flex;flex-direction:column;align-items:center;gap:1px">
            <span style="font-size:27px;font-weight:900;color:${on?dark:'var(--ink)'};line-height:1.05">${esc(k)}</span>
            <span style="font-size:12px;font-weight:800;color:var(--ink3)">${esc(ph[0])}</span>
            ${S.showThai?`<span style="font-size:12.5px;font-weight:800;color:${on?dark:'var(--ink2)'}">${esc(thSnd(k))}</span>`:''}
          </button>`;
        }).join('')}
      </div>
    </div>
    <div class="card col" style="width:340px;flex:0 0 auto;align-items:center;justify-content:center;gap:11px;border-color:${tint}">
      <div style="font-size:78px;font-weight:900;color:${dark};line-height:1">${esc(sel)}</div>
      <div class="row g10">
        <span style="font-size:24px;font-weight:800;color:var(--ink2)">${esc(p[0])}</span>
        ${S.showThai&&thSnd(sel)?`<span style="font-size:26px;font-weight:900;color:${dark}">อ่านว่า “${esc(thSnd(sel))}”</span>`:''}
      </div>
      ${S.showThai&&thTip(sel)?`<div class="soft tc" style="padding:9px 14px;width:100%;font-size:15.5px;font-weight:700;color:var(--ink2)">💡 ${esc(thTip(sel))}</div>`:''}
      <button class="btn lg" style="background:${col};box-shadow:0 5px 0 ${dark}"
        data-act="say" data-t="${esc(p[1])}" data-r="0.5">🔊 ฟังเสียงนี้</button>
      ${p[2]?`<div class="soft tc" style="padding:10px 18px;width:100%">
        <div class="hint">ตัวอย่างคำ</div>
        <button style="font-size:32px;font-weight:900;color:${dark}" data-act="phonics"
          data-w="${esc(p[2])}" data-p="">${esc(p[2])}</button>
        <div class="hint">แตะคำเพื่อฟังทีละเสียง</div></div>`:''}
    </div>
  </div>`;
};
ACT.wallgrp=d=>{ S.wallIdx=+d.i; S.wallKey=''; render(); };
ACT.wallkey=d=>{ S.wallKey=d.k; render(); Voice.say(sayOf(d.k),0.5); };

/* ---------- 6.3 RHYMING CHANT ---------- */
VIEWS.chant = ()=>{
  const c=CHANTS[S.chantIdx], col=C(c.color), tint=C(c.color+'-t'), dark=C(c.color+'-d');
  const mark=ln=>{
    let out=esc(ln.en);
    (ln.key||[]).forEach(k=>{ out=out.replace(new RegExp('\\b'+k+'\\b','g'),
      `<b style="color:${col}">${k}</b>`); });
    return out;
  };
  return `
  <div class="row g8" style="margin-bottom:9px">
    ${CHANTS.map((x,i)=>`<button class="chip ${i===S.chantIdx?'on':''}"
      style="${i===S.chantIdx?`background:${C(x.color)};border-color:${C(x.color)}`:`color:${C(x.color+'-d')};border-color:${C(x.color+'-t')}`}"
      data-act="cpick" data-i="${i}">${x.emoji} ${esc(x.th)}</button>`).join('')}
    <div class="spacer"></div>
    <button class="btn sm" style="background:${col};box-shadow:0 5px 0 ${dark}" data-act="csing">🎤 ร้องทั้งบท</button>
    <button class="btn ghost sm" data-act="cstop">⏹ หยุด</button>
  </div>
  <div class="card f1 col" style="border-color:${tint};overflow:hidden">
    <div class="row g12" style="margin-bottom:5px">
      <div style="font-size:36px">${c.emoji}</div>
      <div class="col f1">
        <div style="font-size:25px;font-weight:900;color:${dark}">${esc(c.title)}</div>
        <div class="hint">${esc(c.unit)} — แตะทีละบรรทัดเพื่อฟังเฉพาะบรรทัดนั้น · คำสีเข้มคือคำที่สัมผัสกัน</div>
      </div>
    </div>
    <div class="rowlist f1">
      ${c.lines.map((ln,i)=>`<button class="sline ${i===S.chantLine?'on':''}"
        style="padding:8px 14px;border-radius:16px" data-act="cline" data-i="${i}">
        <div style="font-size:26px;font-weight:700;line-height:1.32">${mark(ln)}</div>
        <div class="th" style="font-size:15px;color:var(--ink3);font-weight:700">${esc(th(ln.th))}</div>
      </button>`).join('')}
    </div>
  </div>`;
};
ACT.cpick=d=>{ S.chantIdx=+d.i; S.chantLine=-1; render(); };
ACT.cline=d=>{ S.chantLine=+d.i; render(); Voice.say(CHANTS[S.chantIdx].lines[+d.i].en, 0.82); };
ACT.cstop=()=>{ Voice.stop(); S.chantLine=-1; render(); };
ACT.csing=()=>{
  const c=CHANTS[S.chantIdx];
  Voice.sequence(c.lines.map(l=>({text:l.en, rate:Math.max(.4,S.rate-.02), gap:Math.round(200/S.rate)})),
    i=>{ S.chantLine=i; render(); },
    ()=>{ S.chantLine=-1; star(2); render(); });
};

/* ---------- 6.4 WORD SCRAMBLE ---------- */
function loadScramble(i){
  const it=SCRAMBLE[i];
  S.scrIdx=i; S.scrTiles=shuffle(it.w.split('').map((ch,k)=>({id:k,ch})));
  S.scrPicked=[]; S.scrMsg=''; S.scrOk=false; S.scrBad=false;
}
VIEWS.scramble = ()=>{
  const it=SCRAMBLE[S.scrIdx];
  return `
  <div class="row g10" style="margin-bottom:9px">
    <div class="pill">ข้อ <b>&nbsp;${S.scrIdx+1} / ${SCRAMBLE.length}</b></div>
    <div class="row g6 f1 wrap">
      ${SCRAMBLE.map((_,i)=>`<span style="width:${i===S.scrIdx?24:11}px;height:11px;border-radius:6px;
        background:${i===S.scrIdx?C('teal'):(i<S.scrIdx?C('teal-t'):'#EFE0CC')};display:inline-block"></span>`).join('')}
    </div>
  </div>
  <div class="card f1 col ${S.scrBad?'shake':''}" style="align-items:center;justify-content:center;gap:18px;border-color:${C('teal-t')}">
    <div style="font-size:78px;line-height:1" class="bob">${it.emoji}</div>
    <div class="th" style="font-size:20px;font-weight:800;color:var(--ink2);min-height:25px">${esc(th(it.th))}</div>
    <div class="row g10 wrap center">
      ${it.w.split('').map((_,i)=>{
        const id=S.scrPicked[i], filled=id!==undefined;
        const ch=filled?S.scrTiles.find(t=>t.id===id).ch:'';
        return `<button class="slot" data-act="sunpick" data-i="${i}" style="${
          S.scrOk?`background:${C('teal-t')};border:3px solid ${C('teal')};color:${C('teal-d')}`
                 :(filled?`background:${C('orange-t')};border:3px solid ${C('orange-t')};color:${C('orange-d')}`:'')}">${esc(ch)}</button>`;
      }).join('')}
    </div>
    <div class="row g10 wrap center">
      ${S.scrTiles.map(t=>{
        const used=S.scrPicked.indexOf(t.id)>=0;
        return `<button class="tile" data-act="spick" data-id="${t.id}"
          style="background:${used?'#F3ECE3':C('orange-t')};color:${used?'#C6B7A6':C('orange-d')};
                 box-shadow:0 5px 0 ${used?'#E5DBCE':'#F5C0A5'};opacity:${used?.45:1}">${esc(t.ch)}</button>`;
      }).join('')}
    </div>
    <div class="msg" style="color:${S.scrOk?C('teal-d'):C('orange-d')}">${esc(S.scrMsg)}</div>
    <div class="row g10">
      ${btnSlow(it.w,'','ghost')}
      <button class="btn ghost" data-act="sreset">↺ เริ่มใหม่</button>
      <button class="btn" style="background:${C('teal')};box-shadow:0 5px 0 ${C('teal-d')}" data-act="snext">คำต่อไป ▶</button>
    </div>
  </div>`;
};
ACT.spick=d=>{
  if(S.scrOk) return;
  const id=+d.id;
  if(S.scrPicked.indexOf(id)>=0) return;
  S.scrPicked.push(id);
  const word=SCRAMBLE[S.scrIdx].w;
  if(S.scrPicked.length<word.length){ S.scrMsg=''; S.scrBad=false; render(); return; }
  const built=S.scrPicked.map(i=>S.scrTiles.find(t=>t.id===i).ch).join('');
  if(built===word){
    S.scrOk=true; S.scrBad=false;
    S.scrMsg='เก่งมาก! '+word+' = '+SCRAMBLE[S.scrIdx].th+' 🎉';
    star(1); render(); Voice.phonics(word, word.split(''));
  }else{
    S.scrBad=true; S.scrMsg='ยังไม่ใช่นะ ลองอีกครั้ง 💪'; render();
    setTimeout(()=>{ S.scrPicked=[]; S.scrBad=false; render(); },750);
  }
};
ACT.sunpick=d=>{ if(!S.scrOk){ S.scrPicked=S.scrPicked.slice(0,+d.i); render(); } };
ACT.sreset =()=>{ loadScramble(S.scrIdx); render(); };
ACT.snext  =()=>{ loadScramble((S.scrIdx+1)%SCRAMBLE.length); render(); };
/* ---------- 6.5 MISSING SOUND ---------- */
const misOnset = it => it.blank==='onset' ? it.opts[0] : it.w.slice(0, it.w.length-it.opts[0].length);
const misRime  = it => it.w.slice(misOnset(it).length);
VIEWS.missing = ()=>{
  const it=MISSING[S.misIdx], isOn=it.blank==='onset', correct=it.opts[0];
  const rest=isOn ? it.w.slice(correct.length) : it.w.slice(0,it.w.length-correct.length);
  const opts=shuffleStable(it.opts,S.misIdx);
  const picked=S.misPick!==null, right=S.misPick===correct;
  const blankHTML=`<span style="color:${picked?C('teal-d'):'#DCC9B4'};min-width:96px;text-align:center;
      border-bottom:8px solid #E7D6C1;display:inline-block">${picked?esc(correct):'?'}</span>`;
  return `
  <div class="row g10" style="margin-bottom:9px">
    <div class="pill">ข้อ <b>&nbsp;${S.misIdx+1} / ${MISSING.length}</b></div>
    <div class="hint">ฟังคำ แล้วเลือก “เสียงที่หายไป”</div>
    <div class="spacer"></div>
    <button class="btn ghost sm" data-act="msay">👂 ฟังคำนี้</button>
    ${btnSlow(it.w, misOnset(it)+'|'+misRime(it), 'ghost sm')}
  </div>
  <div class="card f1 col" style="align-items:center;justify-content:center;gap:18px;border-color:${C('gold-t')}">
    <div style="font-size:80px" class="bob">${it.emoji}</div>
    <div class="row" style="font-size:62px;font-weight:900;letter-spacing:2px">
      ${isOn ? blankHTML+`<span>${esc(rest)}</span>` : `<span>${esc(rest)}</span>`+blankHTML}
    </div>
    <div class="th" style="font-size:20px;font-weight:800;color:var(--ink2)">${esc(th(it.th))}</div>
    <div class="row g12 wrap center">
      ${opts.map(o=>{
        const isRight=o===correct;
        const bg=picked?(isRight?C('teal-t'):(S.misPick===o?C('pink-t'):'#FFFCF5')):'#FFFCF5';
        const bd=picked?(isRight?C('teal'):(S.misPick===o?C('pink'):C('line'))):C('line');
        return `<button class="opt ${S.misPick===o&&!isRight?'shake':''}" data-act="mpick" data-o="${esc(o)}"
          style="min-width:158px;justify-content:center;background:${bg};border-color:${bd};font-size:36px">
          ${esc(o)} <span style="font-size:15px;color:var(--ink3)">${esc(ipaOf(o))}</span>
          ${picked&&isRight?'✅':(S.misPick===o?'❌':'')}</button>`;
      }).join('')}
    </div>
    <div class="msg" style="color:${!picked?'var(--ink3)':(right?C('teal-d'):C('pink-d'))}">
      ${!picked?'แตะปุ่ม 👂 ฟังคำก่อนก็ได้นะ'
        :(right?'ถูกต้อง! '+it.w+' = '+it.th+' ⭐⭐':'คำตอบคือ '+correct+' → '+it.w)}
    </div>
    <button class="btn" style="background:${C('gold')};box-shadow:0 5px 0 ${C('gold-d')}" data-act="mnext">ข้อต่อไป ▶</button>
  </div>`;
};
ACT.msay =()=>Voice.say(MISSING[S.misIdx].w, 0.7);
ACT.mpick=d=>{
  if(S.misPick!==null) return;
  const it=MISSING[S.misIdx];
  S.misPick=d.o;
  if(d.o===it.opts[0]){ star(2); Voice.say('Yes! '+it.w, 0.78); }
  else Voice.phonics(it.w,[misOnset(it),misRime(it)]);
  render();
};
ACT.mnext=()=>{ S.misIdx=(S.misIdx+1)%MISSING.length; S.misPick=null; render(); setTimeout(ACT.msay,260); };

/* ---------- 6.6 CIRCLE THE WORD ---------- */
VIEWS.circle = ()=>{
  const it=CIRCLE[S.cirIdx];
  const opts=shuffleStable(it.opts,S.cirIdx);
  const picked=S.cirPick!==null, right=S.cirPick===it.w;
  return `
  <div class="row g10" style="margin-bottom:9px">
    <div class="pill">ข้อ <b>&nbsp;${S.cirIdx+1} / ${CIRCLE.length}</b></div>
    <div class="hint">ดูภาพ แล้วเลือกคำที่ตรงกับภาพ — คำที่ให้เลือกเสียงคล้ายกันมาก ต้องฟังดีๆ</div>
    <div class="spacer"></div>
    <button class="btn ghost sm" data-act="csayall">👂 ฟังทุกคำ</button>
  </div>
  <div class="card f1 col" style="align-items:center;justify-content:center;gap:22px;border-color:${C('coral-t')}">
    <div style="font-size:104px;line-height:1" class="${picked&&right?'pop':'bob'}">${it.emoji}</div>
    <div class="th" style="font-size:20px;font-weight:800;color:var(--ink2);min-height:26px">${esc(picked?th(it.th):'')}</div>
    <div class="row g14 wrap center" style="gap:14px">
      ${opts.map(o=>{
        const isRight=o===it.w;
        const bg=picked?(isRight?C('teal-t'):(S.cirPick===o?C('pink-t'):'#FFFCF5')):'#FFFCF5';
        const bd=picked?(isRight?C('teal'):(S.cirPick===o?C('pink'):C('line'))):C('line');
        return `<button class="opt ${S.cirPick===o&&!isRight?'shake':''}" data-act="cirpick" data-o="${esc(o)}"
          style="min-width:190px;justify-content:center;background:${bg};border-color:${bd};font-size:38px;padding:16px">
          ${esc(o)} ${picked&&isRight?'✅':(S.cirPick===o?'❌':'')}</button>`;
      }).join('')}
    </div>
    <div class="msg" style="color:${!picked?'var(--ink3)':(right?C('teal-d'):C('pink-d'))}">
      ${!picked?'แตะคำเพื่อฟังเสียงก่อนเลือกได้'
        :(right?'ถูกต้อง! '+it.w+' = '+it.th+' ⭐⭐':'คำที่ถูกคือ '+it.w+' = '+it.th)}
    </div>
    <div class="row g10">
      ${btnSlow(it.w,'','ghost')}
      <button class="btn" style="background:${C('coral')};box-shadow:0 5px 0 ${C('coral-d')}" data-act="cirnext">ข้อต่อไป ▶</button>
    </div>
  </div>`;
};
ACT.csayall=()=>{
  const it=CIRCLE[S.cirIdx];
  Voice.sequence(shuffleStable(it.opts,S.cirIdx).map(o=>({text:o, rate:Math.max(.4,S.rate-.12), gap:Math.round(320/S.rate)})));
};
ACT.cirpick=d=>{
  if(S.cirPick!==null) return;
  const it=CIRCLE[S.cirIdx];
  S.cirPick=d.o;
  if(d.o===it.w){ star(2); Voice.say('Yes! '+it.w, 0.78); } else Voice.phonics(it.w);
  render();
};
ACT.cirnext=()=>{ S.cirIdx=(S.cirIdx+1)%CIRCLE.length; S.cirPick=null; render(); };

/* ---------- 6.7 MATCH & LINK ---------- */
function loadMatch(mode){
  const pairs=MATCH[mode].pairs;
  S.matMode=mode;
  S.matLeft=shuffle(pairs.map((_,i)=>i));
  S.matRight=shuffle(pairs.map((_,i)=>i));
  S.matSel=null; S.matDone={}; S.matBad=null;
}
VIEWS.match = ()=>{
  const pairs=MATCH[S.matMode].pairs;
  const tones=[C('orange-t'),C('teal-t'),C('blue-t'),C('purple-t'),C('gold-t')];
  const lines=[C('orange'),C('teal'),C('blue'),C('purple'),C('gold')];
  const done=Object.keys(S.matDone).length;
  return `
  <div class="row g8" style="margin-bottom:9px">
    ${Object.keys(MATCH).map(k=>`<button class="chip ${k===S.matMode?'on':''}"
      style="${k===S.matMode?`background:${C('blue')};border-color:${C('blue')}`:''}"
      data-act="mmode" data-k="${k}">${MATCH[k].label}</button>`).join('')}
    <div class="spacer"></div>
    <div class="pill">${done===pairs.length?'ครบทุกคู่แล้ว เก่งมาก! 🎉':`จับคู่แล้ว <b>&nbsp;${done} / ${pairs.length}</b>`}</div>
    <button class="btn ghost sm" data-act="mreset">↺ เริ่มใหม่</button>
  </div>
  <div class="row g16 f1" style="align-items:stretch">
    <div class="col g9 f1" style="gap:9px">
      ${S.matLeft.map(i=>{
        const ok=S.matDone[i]!==undefined;
        return `<button class="opt f1" data-act="mleft" data-i="${i}"
          style="background:${ok?tones[S.matDone[i]%5]:'#fff'};
                 border-color:${ok?lines[S.matDone[i]%5]:(S.matSel===i?C('blue'):C('line'))}">
          <span style="font-size:28px">${pairs[i].icon}</span>
          <span class="f1">${esc(pairs[i].l)}</span>
          <span style="font-size:22px">${ok?'✅':(S.matSel===i?'👉':'')}</span></button>`;
      }).join('')}
    </div>
    <div class="col g9 f1" style="gap:9px">
      ${S.matRight.map(i=>{
        const ok=S.matDone[i]!==undefined;
        return `<button class="opt f1 ${S.matBad===i?'shake':''}" data-act="mright" data-i="${i}"
          style="background:${ok?tones[S.matDone[i]%5]:'#fff'};border-color:${ok?lines[S.matDone[i]%5]:C('line')}">
          <span class="f1"><span>${esc(pairs[i].r)}</span><br><span class="th">${esc(th(pairs[i].th))}</span></span>
          <span style="font-size:22px">${ok?'✅':''}</span></button>`;
      }).join('')}
    </div>
  </div>`;
};
ACT.mmode =d=>{ loadMatch(d.k); render(); };
ACT.mreset=()=>{ loadMatch(S.matMode); render(); };
ACT.mleft =d=>{ const i=+d.i; if(S.matDone[i]!==undefined) return; S.matSel=i; S.matBad=null;
  Voice.say(MATCH[S.matMode].pairs[i].l,0.8); render(); };
ACT.mright=d=>{
  const i=+d.i, sel=S.matSel, pairs=MATCH[S.matMode].pairs;
  if(sel===null||S.matDone[i]!==undefined) return;
  if(sel===i){ S.matDone[i]=Object.keys(S.matDone).length; S.matSel=null; star(1);
    Voice.say(pairs[i].l+' '+pairs[i].r,0.8); }
  else { S.matBad=i; setTimeout(()=>{S.matBad=null;render();},600); }
  render();
};

/* ---------- 6.8 WORD SORT ---------- */
function loadSort(i){
  S.sortIdx=i; S.sortQueue=shuffle(SORTS[i].items.slice());
  S.sortDone=0; S.sortBad=false; S.sortMsg='';
}
VIEWS.sort = ()=>{
  const st=SORTS[S.sortIdx];
  const cur=S.sortQueue[0];
  const total=st.items.length;
  return `
  <div class="row g8" style="margin-bottom:9px">

ACT.sortset  =d=>{ loadSort(+d.i); render(); };
ACT.sortreset=()=>{ loadSort(S.sortIdx); render(); };
ACT.sortsay  =()=>{ const c=S.sortQueue[0]; if(c) Voice.phonics(c.w); };
ACT.sortbin  =d=>{
  const cur=S.sortQueue[0]; if(!cur) return;
  if(cur.bin===d.k){
    S.sortQueue=S.sortQueue.slice(1); S.sortDone++; S.sortBad=false;
    S.sortMsg='ถูกต้อง! '+cur.w+' = '+cur.th+' ⭐';
    star(1); Voice.say('Yes! '+cur.w, 0.78);
  }else{
    S.sortBad=true; S.sortMsg='ยังไม่ใช่นะ ลองคิดอีกที 💪';
    Voice.say(cur.w, 0.65);
    setTimeout(()=>{ S.sortBad=false; render(); },700);
  }
  render();
};

/* ---------- 6.9 READ ALONG ---------- */
VIEWS.read = ()=>{

  return `
  <div class="scrollx" style="margin-bottom:8px">
    ${STORIES.map((x,i)=>`<button class="chip ${i===S.storyIdx?'on':''}"
      style="${i===S.storyIdx?`background:${C(x.color)};border-color:${C(x.color)}`:`color:${C(x.color+'-d')};border-color:${C(x.color+'-t')}`}"
      data-act="stpick" data-i="${i}">${x.emoji} ${esc(x.title)}</button>`).join('')}
  </div>
  <div class="row g8" style="margin-bottom:8px">
    <button class="chip ${S.storyTab==='read'?'on':''}" style="${S.storyTab==='read'?`background:${col};border-color:${col}`:''}"
      data-act="sttab" data-k="read">📖 อ่านเรื่อง</button>
    <button class="chip ${S.storyTab==='quiz'?'on':''}" style="${S.storyTab==='quiz'?`background:${col};border-color:${col}`:''}"

function readBody(st,col,dark){
  return `
  <div class="row g16 f1" style="align-items:stretch">
    <div class="card f1 col" style="overflow:hidden;border-color:${C(st.color+'-t')}">
      <div class="row g12" style="margin-bottom:4px">
        <div style="font-size:36px">${st.emoji}</div>
        <div class="col f1">
          <div style="font-size:24px;font-weight:900;color:${dark}">${esc(st.title)}</div>
          <div class="th hint">${esc(th(st.th))}</div>
        </div>
        <button class="btn sm" style="background:${col};box-shadow:0 5px 0 ${dark}" data-act="stall">🔊 อ่านทั้งเรื่อง</button>
        <button class="btn ghost sm" data-act="ststop">⏹</button>
      </div>
      <div class="story f1">
        ${st.lines.map((ln,li)=>`<div class="sline ${li===S.readLine?'on':''}">${
          ln.split(' ').map((wd,wi)=>{
            const clean=wd.toLowerCase().replace(/[^a-z']/g,'');
            const def=DICT[clean];
            const on=S.tipWord&&S.tipWord.k===li+'-'+wi;
            return `<span class="w ${def?'hasdef':''} ${on?'on':''}" data-act="stword"

      </div>
    </div>
    <div class="col g10" style="width:340px;flex:0 0 auto">
      <div class="card f1 col tc" style="align-items:center;justify-content:center;gap:9px;border-color:${C(st.color+'-t')}">
        <div style="font-size:48px">${S.tipWord?'💡':'👆'}</div>
        <div style="font-size:34px;font-weight:900;color:${dark};line-height:1.1">${esc(S.tipWord?S.tipWord.w:'แตะคำในเรื่อง')}</div>
        <div style="font-size:19px;font-weight:800;color:var(--ink2)">${
          esc(S.tipWord?th(S.tipWord.th):'จะได้ยินเสียงอ่าน และเห็นคำแปลภาษาไทย')}</div>
        ${S.tipWord?`<div class="row g8">
          <button class="btn ghost sm" data-act="say" data-t="${esc(S.tipWord.w)}" data-r="0.72">🔊 ฟังอีกครั้ง</button>
          ${btnSlow(S.tipWord.w,'','ghost sm')}</div>`:''}
      </div>
      <div class="soft" style="padding:12px 16px">
        <div class="hint">คำที่มีขีดใต้ = มีคำแปล แตะได้เลย · ปรับความเร็วเสียงที่ปุ่มด้านบน</div>
      </div>
    </div>
  </div>`;
}
function quizBody(st,col,dark){
  const q=st.q[Math.min(S.qIdx,st.q.length-1)], picked=S.qPick!==null;
  return `
  <div class="card f1 col" style="gap:15px;justify-content:center;border-color:${C(st.color+'-t')}">
    <div class="row g12">
      <div class="pill">ข้อ <b>&nbsp;${S.qIdx+1} / ${st.q.length}</b></div>
      <div class="spacer"></div>
      <button class="btn ghost sm" data-act="say" data-t="${esc(q.q)}" data-r="0.8">🔊 ฟังคำถาม</button>
    </div>
    <div>
      <div style="font-size:30px;font-weight:900;line-height:1.28">${esc(q.q)}</div>
      <div class="th" style="font-size:18px;font-weight:700;color:var(--ink2);margin-top:2px">${esc(th(q.th))}</div>
    </div>
    <div class="col g12">
      ${q.o.map((o,i)=>{
        const right=i===q.a;
        const bg=picked?(right?C('teal-t'):(S.qPick===i?C('pink-t'):'#FFFCF5')):'#FFFCF5';
        const bd=picked?(right?C('teal'):(S.qPick===i?C('pink'):C('line'))):C('line');
        return `<button class="opt ${S.qPick===i&&!right?'shake':''}" data-act="qpick" data-i="${i}"
          style="background:${bg};border-color:${bd}">
          <span class="badge" style="background:${picked&&right?C('teal'):'#E2D2BE'}">${i===0?'a':'b'}</span>
          <span class="f1">${esc(o)}</span>
          <span style="font-size:22px">${picked&&right?'✅':(S.qPick===i?'❌':'')}</span></button>`;
      }).join('')}
    </div>
    <div class="msg" style="color:${!picked?'var(--ink3)':(S.qPick===q.a?C('teal-d'):C('pink-d'))}">
      ${!picked?'อ่านเรื่องแล้วเลือกคำตอบ a หรือ b':(S.qPick===q.a?'ถูกต้อง! '+q.why:'เฉลย: '+q.why)}
    </div>
    <div class="row g10">
      <button class="btn ghost" data-act="sttab" data-k="read">📖 กลับไปอ่านเรื่อง</button>
      <button class="btn" style="background:${col};box-shadow:0 5px 0 ${dark}" data-act="qnext">ข้อต่อไป ▶</button>
    </div>
  </div>`;
}
ACT.stpick=d=>{ S.storyIdx=+d.i; S.qIdx=0; S.qPick=null; S.tipWord=null; S.readLine=-1; render(); };
ACT.sttab =d=>{ S.storyTab=d.k; render(); };
ACT.stword=d=>{ S.tipWord={w:d.w, th:DICT[d.w]||'—', k:d.k}; render(); Voice.say(d.w,0.72); };
ACT.stall =()=>{
  const st=STORIES[S.storyIdx];
  Voice.sequence(st.lines.map(l=>({text:l, rate:Math.max(.4,S.rate), gap:Math.round(230/S.rate)})),
    i=>{ S.readLine=i; render(); }, ()=>{ S.readLine=-1; star(2); render(); });
};
ACT.ststop=()=>{ Voice.stop(); S.readLine=-1; render(); };
ACT.qpick =d=>{
  if(S.qPick!==null) return;
  const q=STORIES[S.storyIdx].q[S.qIdx], i=+d.i;
  S.qPick=i; Voice.say(q.o[i],0.8);
  if(i===q.a) star(2);
  render();
};
ACT.qnext=()=>{ const st=STORIES[S.storyIdx]; S.qIdx=(S.qIdx+1)%st.q.length; S.qPick=null; render(); };
/* ---------- 6.10 YES OR NO ---------- */

ACT.ynpick=d=>{

/* ---------- 6.11 SIGHT WORDS ---------- */
function loadSight(i){
  S.sightIdx=i;
  const target=SIGHT[i];
  const pool=shuffle(SIGHT.filter(x=>x.w!==target.w)).slice(0,3);
  S.sightOpts=shuffle([target].concat(pool));
  S.sightPick=null;
}
VIEWS.sight = ()=>{
  const target=SIGHT[S.sightIdx], picked=S.sightPick!==null, right=S.sightPick===target.w;
  return `
  <div class="row g10" style="margin-bottom:9px">
    <div class="pill">ชุด <b>&nbsp;${esc(target.set)}</b></div>
    <div class="pill">คำที่ <b>&nbsp;${S.sightIdx+1} / ${SIGHT.length}</b></div>
    <div class="hint">Sight words = คำที่ต้องจำทั้งคำ สะกดตามเสียงไม่ได้</div>
    <div class="spacer"></div>
    <button class="btn sm" style="background:${C('cyan')};box-shadow:0 5px 0 ${C('cyan-d')}" data-act="wsay">👂 ฟังอีกครั้ง</button>
  </div>
  <div class="card f1 col" style="align-items:center;justify-content:center;gap:22px;border-color:${C('cyan-t')}">
    <div style="font-size:60px" class="bob">👂</div>
    <div style="font-size:23px;font-weight:800;color:var(--ink2)">ครูอ่านคำไหน? แตะคำที่ถูกต้อง</div>
    <div class="row g16 wrap center">
      ${S.sightOpts.map(o=>{
        const isRight=o.w===target.w;
        const bg=picked?(isRight?C('cyan-t'):(S.sightPick===o.w?C('pink-t'):'#fff')):'#fff';
        const bd=picked?(isRight?C('cyan'):(S.sightPick===o.w?C('pink'):C('line'))):C('line');
        return `<button class="opt ${S.sightPick===o.w&&!isRight?'shake':''}" data-act="wpick" data-w="${esc(o.w)}"
          style="min-width:220px;justify-content:center;flex-direction:column;gap:2px;padding:20px 16px;
                 background:${bg};border-color:${bd}">
          <span style="font-size:44px;font-weight:900">${esc(o.w)}</span>
          <span class="th">${esc(picked?th(o.th):'')}</span>
          <span style="font-size:20px">${picked&&isRight?'✅':(S.sightPick===o.w?'❌':'')}</span></button>`;
      }).join('')}
    </div>
    <div class="msg" style="color:${!picked?'var(--ink3)':(right?C('cyan-d'):C('pink-d'))}">
      ${!picked?'ฟังไม่ทัน กดปุ่ม 👂 ฟังอีกครั้งได้ · ปรับให้ช้าลงที่ปุ่ม 🐢 ด้านบน'
        :(right?'ถูกต้อง! '+target.w+' = '+target.th+' ⭐⭐':'คำที่ครูอ่านคือ "'+target.w+'" = '+target.th)}
    </div>
    <button class="btn" style="background:${C('cyan')};box-shadow:0 5px 0 ${C('cyan-d')}" data-act="wnext">คำต่อไป ▶</button>
  </div>`;
};
ACT.wsay =()=>Voice.say(SIGHT[S.sightIdx].w, 0.66);
ACT.wpick=d=>{
  if(S.sightPick!==null) return;

ACT.colpart =d=>{
  const part=d.p;
  if(!S.colPaint){ delete S.colFill[part]; S.colMsg='ลบสีแล้ว'; render(); return; }
  S.colFill[part]=paintHex(S.colPaint);
  const task=COLOUR_TASKS.find(t=>t.part===part);
  if(task && task.paint===S.colPaint){
    S.colMsg='ถูกต้อง! '+task.en+' ⭐';
    star(1); Voice.say(task.en,0.78);
    const idx=COLOUR_TASKS.indexOf(task);
    const nextIdx=COLOUR_TASKS.findIndex((t,i)=>i>idx && S.colFill[t.part]!==paintHex(t.paint));
    S.colTask = nextIdx>=0 ? nextIdx : idx;
  }else{
    S.colMsg='ยังไม่ตรงกับคำสั่งนะ ลองอ่านอีกครั้ง';
    Voice.say(task?task.en:S.colPaint,0.7);
  }
  render();
};

function resetRace(){
  S.racePos=[4,4,4,4]; S.raceOver=false; S.raceIdx=0;
  S.raceOk=null; S.raceMsg=''; S.raceHeard=''; S.raceChoice=null; S.raceListening=false;
}
VIEWS.race = ()=>{
  const it=RACE_WORDS[S.raceIdx];
  const names=[S.kidName+' 🎀'].concat(RIVALS.map(r=>r.name));
  const cars =['🚕'].concat(RIVALS.map(r=>r.car));
  const cols =[C('purple')].concat(RIVALS.map(r=>r.color));
  const lead =S.racePos.indexOf(Math.max.apply(null,S.racePos));
  const stage=S.raceOver
    ? (S.racePos[0]>=100?'🏆 '+S.kidName+' ชนะ! เก่งมาก':'🏁 '+names[lead]+' เข้าเส้นชัยก่อน — ลองใหม่อีกครั้ง!')
    : 'อ่านคำนี้ให้ถูก แล้วรถของหนูจะพุ่งแซง';
  const opts=shuffleStable([it.w].concat(it.near),S.raceIdx);
  const p1=phon(it.parts[0]), p2=phon(it.parts[1]);
  return `
  <div class="col g8 f1">
    <div class="col g6" style="flex:0 0 208px">
      ${S.racePos.map((p,i)=>`
        <div class="lane f1" style="border-color:${i===0?cols[0]:C('line')}">
          <div class="road"></div>
          <div class="lanename" style="color:${cols[i]}">${esc(names[i])}</div>
          <div class="flag">🏁</div>
          <div class="car ${i===0&&S.raceOk===true?'pop':(i===0&&S.raceOk===false?'shake':'')}"
               style="left:${Math.min(95,p)}%">${cars[i]}</div>
        </div>`).join('')}
    </div>
    <div class="row g10 f0">
      <button class="chip ${S.raceMode==='tap'?'on':''}" style="${S.raceMode==='tap'?`background:${C('blue')};border-color:${C('blue')}`:''}"
        data-act="rmode" data-k="tap">👂 ฟังแล้วเลือกคำ</button>
      <button class="chip ${S.raceMode==='mic'?'on':''}" style="${S.raceMode==='mic'?`background:${C('blue')};border-color:${C('blue')}`:''}"
        data-act="rmode" data-k="mic">🎤 พูดใส่ไมค์</button>
      <div class="spacer"></div>
      <div class="hint">${esc(stage)}</div>
      <button class="btn ghost sm" data-act="rreset">↺ แข่งใหม่</button>
    </div>
    <div class="card f1 row g16" style="align-items:center;border-color:${C('blue-t')}">
      <div class="col g8" style="width:330px;flex:0 0 auto;align-items:center">
        <div style="font-size:54px;font-weight:900;color:${C('blue-d')};line-height:1.05">${esc(it.w)}</div>
        <div class="th" style="font-size:18px;font-weight:800;color:var(--ink2)">${esc(th(it.th))}</div>
        <div class="row g8">
          <button class="part" style="background:${C('orange-t')};color:${C('orange-d')};font-size:28px;padding:9px 15px"
            data-act="say" data-t="${esc(p1[1])}" data-r="0.5">${esc(it.parts[0])}<small>${esc(p1[0])}</small></button>
          <div class="op" style="font-size:24px">+</div>
          <button class="part" style="background:${C('teal-t')};color:${C('teal-d')};font-size:28px;padding:9px 15px"
            data-act="say" data-t="${esc(p2[1])}" data-r="0.5">${esc(it.parts[1])}<small>${esc(p2[0])}</small></button>
        </div>
        ${btnSlow(it.w, it.parts.join('|'), 'ghost sm')}
      </div>
      <div class="col g8 f1">
        ${S.raceMode==='mic'?`
          <div class="center f1">
            <button class="btn lg ${S.raceListening?'bob':''}"
              style="background:${S.raceListening?C('pink'):C('blue')};box-shadow:0 5px 0 ${S.raceListening?C('pink-d'):C('blue-d')}"
              data-act="rlisten">${S.raceListening?'🎙️ กำลังฟัง...':'🎤 แตะแล้วพูดคำนี้'}</button>
          </div>
          <div class="hint center">${esc(S.raceHeard)}</div>`
        :`
          <div class="col g8 f1">
            ${opts.map(o=>{
              const isRight=o===it.w, picked=S.raceChoice!==null;
              const bg=!picked?'#FFFCF5':(isRight?C('teal-t'):(S.raceChoice===o?C('pink-t'):'#FFFCF5'));
              const bd=!picked?C('line'):(isRight?C('teal'):(S.raceChoice===o?C('pink'):C('line')));
              return `<button class="opt f1 ${S.raceChoice===o&&!isRight?'shake':''}" data-act="rchoice" data-o="${esc(o)}"
                style="background:${bg};border-color:${bd};justify-content:center;font-size:29px">
                ${esc(o)} ${picked&&isRight?'✅':(S.raceChoice===o?'❌':'')}</button>`;
            }).join('')}
          </div>
          <button class="btn ghost sm center" data-act="say" data-t="${esc(it.w)}" data-r="0.66">👂 ฟังอีกครั้ง</button>`}
        <div class="msg center" style="color:${S.raceOk===true?C('teal-d'):(S.raceOk===false?C('pink-d'):'var(--ink3)')}">
          ${esc(S.raceMsg||(S.raceMode==='mic'?'แตะไมค์แล้วพูดคำให้ชัด':'ฟังเสียงครู แล้วเลือกคำที่ตรงกัน'))}</div>
      </div>
    </div>
  </div>`;
};
ACT.rmode =d=>{ S.raceMode=d.k; S.raceMsg=''; render();
  if(d.k==='tap'){ const it=RACE_WORDS[S.raceIdx]; Voice.phonics(it.w,it.parts); } };
ACT.rreset=()=>{ resetRace(); render(); };
function raceAdvance(ok){
  const pos=S.racePos.slice();
  pos[0]=Math.max(2,Math.min(100,pos[0]+(ok?13:-5)));
  for(let i=0;i<3;i++) pos[i+1]=Math.min(100,pos[i+1]+RIVALS[i].speed*(0.7+Math.random()*0.8));
  const over=pos.some(p=>p>=100);
  if(over&&pos[0]>=100) star(5);
  S.racePos=pos; S.raceOver=over; render();
  setTimeout(()=>{
    if(!S.raceOver){
      S.raceIdx=(S.raceIdx+1)%RACE_WORDS.length;
      S.raceOk=null; S.raceMsg=''; S.raceHeard=''; S.raceChoice=null; render();
      if(S.raceMode==='tap'){ const it=RACE_WORDS[S.raceIdx]; Voice.phonics(it.w,it.parts); }
    }
  }, over?900:1300);
}
ACT.rchoice=d=>{
  if(S.raceChoice!==null||S.raceOver) return;
  const it=RACE_WORDS[S.raceIdx], ok=d.o===it.w;
  S.raceChoice=d.o; S.raceOk=ok;
  S.raceMsg=ok?'ถูกต้อง! รถพุ่งแซง 🚀':'ยังไม่ใช่ ฟังเสียงโฟนิกส์อีกครั้งนะ 🐢';
  if(ok){ star(2); Voice.say('Yes! '+it.w,0.78); } else Voice.phonics(it.w,it.parts);
  raceAdvance(ok);
};
ACT.rlisten=()=>{
  if(S.raceOver) return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ S.raceMode='tap'; S.raceMsg='อุปกรณ์นี้ยังไม่รองรับไมค์ — เปลี่ยนเป็นโหมดฟัง-เลือกให้แล้ว'; render(); return; }
  try{
    const r=new SR();
    r.lang='en-US'; r.interimResults=false; r.maxAlternatives=3;
    r.onresult=e=>{ let best=''; for(let i=0;i<e.results[0].length;i++) best+=' '+e.results[0][i].transcript; judgeRace(best); };
    r.onerror =()=>{ S.raceListening=false; S.raceMsg='ไม่ได้ยินเสียง ลองแตะไมค์แล้วพูดใหม่นะ'; S.raceHeard=''; render(); };
    r.onend   =()=>{ S.raceListening=false; render(); };
    S.raceListening=true; S.raceMsg='พูดเลย!'; S.raceHeard=''; S.raceOk=null; render();
    r.start();
  }catch(e){ S.raceListening=false; S.raceMode='tap'; render(); }
};
function judgeRace(said){
  const it=RACE_WORDS[S.raceIdx];
  const heard=String(said||'').toLowerCase().trim();
  const ok=heard.split(/\s+/).some(w=>w.replace(/[^a-z]/g,'')===it.w);
  S.raceOk=ok; S.raceListening=false;
  S.raceHeard=heard?('ได้ยินว่า: "'+heard+'"'):'ไม่ได้ยินเสียงเลย ลองอีกครั้งนะ';
  S.raceMsg=ok?'ออกเสียงถูกต้อง! รถพุ่งแซง 🚀':'ยังไม่ตรง ฟังครูออกเสียงอีกครั้ง 🐢';
  if(ok){ star(2); Voice.say('Great! '+it.w,0.8); } else Voice.phonics(it.w,it.parts);
  raceAdvance(ok);
}

        <div class="col f1">
          <div style="font-size:25px;font-weight:900">ตั้งค่า</div>
          <div class="hint">ปรับให้เหมาะกับน้อง แล้วปิดหน้าต่างนี้ได้เลย</div>
        </div>
      </div>
      <div class="field"><label>ชื่อเด็ก</label><input type="text" id="setName" value="${esc(S.kidName)}" maxlength="16"></div>
      <div class="field"><label>แสดงคำแปลไทย</label>
        <button class="switch ${S.showThai?'on':''}" data-act="togthai"><i></i></button>
        <span class="hint">ปิดไว้เพื่อฝึกอ่านอังกฤษล้วน</span></div>
      <div class="field"><label>ความเร็วเสียงอ่าน</label>
        <input type="range" id="setRate" min="0.4" max="1.1" step="0.02" value="${S.rate}">
        <span class="hint" id="rateLbl" style="width:66px">${S.rate.toFixed(2)}x</span></div>
      <div class="field"><label>เสียงครู</label>
        <select id="setVoice">
          <option value="">เลือกอัตโนมัติ (เสียงผู้หญิง)</option>
          ${voices.map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===S.voiceURI?'selected':''}>${esc(v.name)} · ${esc(v.lang)}</option>`).join('')}
        </select></div>
      <div class="hint" style="margin:-4px 0 16px 186px">
        ${voices.length?'ระบบเลือกเสียงผู้หญิงให้อัตโนมัติ · เลือกเองได้ถ้าต้องการ'
          :'ยังไม่พบเสียงในเครื่อง — บน iPad ให้เปิดใน Safari แล้วแตะปุ่มเสียงหนึ่งครั้ง'}</div>
      <div class="row g10">
        <button class="btn ghost" data-act="testvoice">🎙️ ทดสอบเสียงครู</button>
        <button class="btn ghost" data-act="resetstars">↺ ล้างดาว</button>
        <div class="spacer"></div>
        <button class="btn" style="background:${C('teal')};box-shadow:0 5px 0 ${C('teal-d')}" data-act="closeset">เสร็จแล้ว</button>
      </div>
    </div>
  </div>`;
  const nameEl=$('#setName'), rateEl=$('#setRate'), voiceEl=$('#setVoice');
  nameEl.oninput  =()=>{ S.kidName=nameEl.value.trim()||'Milin'; save(); render(); };
  rateEl.oninput  =()=>{ S.rate=+rateEl.value; $('#rateLbl').textContent=S.rate.toFixed(2)+'x'; save(); paintSpeed(); };
  voiceEl.onchange=()=>{ S.voiceURI=voiceEl.value; save(); Voice.refresh(); ACT.testvoice(); };
};
/* ปิดได้เมื่อแตะพื้นหลังนอกกล่อง หรือแตะปุ่ม "เสร็จแล้ว" (ปุ่มในกล่องอื่นๆ ยังทำงานปกติ) */
ACT.closeset  =(d,t,e)=>{ if(t.classList.contains('sheet') && e.target!==t) return; $('#modal').innerHTML=''; };
ACT.togthai   =(d,t)=>{ S.showThai=!S.showThai; t.classList.toggle('on',S.showThai); save(); render(); };
ACT.resetstars=()=>{ S.stars=0; save(); render(); };

/* ═════════════════════════════════════════════════════════════════════
   7. BOOT
   ═════════════════════════════════════════════════════════════════════ */
/* ย่อ/ขยายเวทีให้พอดีหน้าจอ */
function fitStage(){
  const k=Math.min(window.innerWidth/1194, window.innerHeight/834);
  document.getElementById('app').style.transform='scale('+k+')';
}
window.addEventListener('resize', fitStage);
window.addEventListener('orientationchange', ()=>setTimeout(fitStage,120));
fitStage();

loadScramble(0); loadMatch('animal'); loadSort(0); loadSight(0); loadColour();
render();
Voice.refresh();
try{ window.speechSynthesis.addEventListener('voiceschanged',()=>Voice.refresh()); }catch(e){}
/* iOS ต้องมี user gesture ครั้งแรกก่อนเสียงจะทำงาน */
['touchstart','mousedown'].forEach(ev=>document.addEventListener(ev,function unlock(){
  try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; window.speechSynthesis.speak(u); }catch(e){}
  Voice.refresh();
  ['touchstart','mousedown'].forEach(e2=>document.removeEventListener(e2,unlock));
},{once:true}));
window.addEventListener('beforeunload',save);
</script>
</body>
</html>
