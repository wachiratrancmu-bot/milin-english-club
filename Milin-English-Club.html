/* ═════════ 1. CSS — Design system ═════════
   แนวคิด: “ใบงานโรงเรียนฉบับน่ารัก” — พื้นขาวอมฟ้าแบบกระดาษ, ตัวหนังสือน้ำเงินกรมท่าแบบหัวใบงาน,
   สีประจำ Unit แบบหัวตารางใบงาน NUDS, ส้มช้าง NUDS เป็นสีหลักของปุ่มสำคัญ
   ฟอนต์: Fredoka (อังกฤษ — ตัว a หัวเดียวแบบที่เด็กหัดเขียน) + Mali (ไทย — กลมมน อ่านง่าย) */
:root{
  --paper:#F4F6FB; --card:#FFFFFF; --line:#E1E7F1; --line2:#CDD6E4;
  --ink:#1E3557; --ink2:#53637E; --ink3:#8E9BB2; --shadow:#D9E0EC;

  --orange:#EE6A24; --orange-t:#FFE8DA; --orange-d:#B44A10;
  --teal:#17A288;   --teal-t:#D3F2EA;   --teal-d:#0B7562;
  --blue:#3C7DDF;   --blue-t:#DCE7FB;   --blue-d:#2458AB;
  --purple:#8C5AD6; --purple-t:#ECE2FA; --purple-d:#6537AE;
  --gold:#E19A0E;   --gold-t:#FFF0CC;   --gold-d:#9E6800;
  --pink:#DE4E87;   --pink-t:#FCE0EB;   --pink-d:#A92A5D;
  --cyan:#1C9FBF;   --cyan-t:#D4F0F7;   --cyan-d:#0E728C;
  --lime:#5EA22F;   --lime-t:#E2F2D1;   --lime-d:#42761A;
  --grape:#6457DA;  --grape-t:#E2DFFB;  --grape-d:#4436B6;
  --coral:#EA5E5E;  --coral-t:#FCE1DF;  --coral-d:#B03A3A;

  /* สีประจำ Unit — อิงสีหัวตารางใบงาน */
  --u1:#F29CC0; --u1-t:#FDE6EF; --u1-d:#A93468;
  --u2:#8CC5EC; --u2-t:#E3F1FB; --u2-d:#1F5F92;
  --u3:#FFCB5C; --u3-t:#FFF3D6; --u3-d:#8C5D00;
  --u4:#FFAE85; --u4-t:#FFEADF; --u4-d:#A8481A;
  --u5:#A3D98A; --u5-t:#E9F6E2; --u5-d:#3A7F22;
  --u6:#C1AAF0; --u6-t:#F0EAFC; --u6-d:#6141AE;
  --u7:#85D6CA; --u7-t:#E0F5F2; --u7-d:#147366;
  --u8:#F5968C; --u8-t:#FDE5E2; --u8-d:#A8392E;

  --ok:#1E9E68; --ok-t:#DBF4E8; --bad:#DB4A5B; --bad-t:#FDE3E6;
  --r:22px;
  --lift:0 1px 0 rgba(30,53,87,.05), 0 12px 28px -16px rgba(30,53,87,.22);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Fredoka","Mali","Noto Sans Thai",-apple-system,"Segoe UI",system-ui,sans-serif;
  color:var(--ink);background:var(--paper);-webkit-user-select:none;user-select:none;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;text-align:inherit}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:14px}
.thai,.th{font-family:"Mali","Fredoka",sans-serif}

#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(circle at 92% 4%, rgba(238,106,36,.10) 0, transparent 22%),
  radial-gradient(circle at 6% 96%, rgba(60,125,223,.10) 0, transparent 24%),
  var(--paper)}
#fit{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
#app{width:1194px;height:834px;flex:0 0 auto;transform-origin:center center;position:relative;
  display:grid;grid-template-columns:104px 1fr}

/* ---------- rail (เมนูซ้าย) ---------- */
.rail{background:#fff;border-right:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;
  padding:14px 0 12px;gap:3px}
.brand{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:8px}
.brand svg{width:50px;height:50px}
.brand b{font-size:13px;font-weight:700;letter-spacing:.3px;color:var(--orange-d)}
.navbtn{width:86px;padding:8px 0 7px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink3);transition:background .15s,color .15s}
.navbtn svg{width:27px;height:27px}
.navbtn span{font-size:12.5px;font-weight:600;line-height:1}
.navbtn.on{background:var(--orange-t);color:var(--orange-d)}
.navbtn:active{transform:scale(.95)}
.rail .grow{flex:1}
.railstar{display:flex;flex-direction:column;align-items:center;font-size:20px;font-weight:700;color:var(--gold-d);
  background:var(--gold-t);border-radius:16px;padding:6px 0;width:78px;line-height:1.1}
.railstar small{font-size:11px;font-weight:600;color:var(--gold-d);opacity:.8}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:14px 22px 8px}
.back{width:46px;height:46px;border-radius:16px;background:#fff;border:1.5px solid var(--line);display:flex;
  align-items:center;justify-content:center;flex:0 0 auto;color:var(--ink2)}
.back svg{width:22px;height:22px}
.titles{display:flex;flex-direction:column;min-width:0}
.t1{font-size:29px;font-weight:700;letter-spacing:-.2px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-family:"Mali",sans-serif;font-size:14.5px;font-weight:500;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1 1 auto}
.ctrl{display:flex;align-items:center;gap:8px}
.seg{display:flex;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:3px}
.seg button{padding:6px 10px;border-radius:12px;font-size:15px;font-weight:600;color:var(--ink2);line-height:1.1}
.seg button.on{background:var(--ink);color:#fff}
.seg .lbl{font-size:11px;font-weight:700;color:var(--ink3);padding:0 6px 0 7px;letter-spacing:.4px;text-transform:uppercase}
.pill{display:flex;align-items:center;gap:7px;background:#fff;border:1.5px solid var(--line);border-radius:16px;
  padding:8px 13px;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap}
.pill b{color:var(--ink);font-weight:700;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.stage{flex:1 1 auto;min-height:0;padding:6px 22px 18px;display:flex;flex-direction:column}

/* ---------- building blocks ---------- */
.card{background:var(--card);border-radius:var(--r);border:1.5px solid var(--line);padding:18px;box-shadow:var(--lift)}
.soft{background:#F8FAFD;border-radius:18px;border:1.5px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:18px;
  padding:13px 22px;font-size:18px;font-weight:600;color:#fff;background:var(--orange);
  box-shadow:0 4px 0 var(--orange-d);transition:transform .08s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--orange-d)}
.btn.sm{padding:9px 15px;font-size:15px;border-radius:14px}
.btn.lg{padding:17px 32px;font-size:22px;border-radius:22px}
.btn.ghost{background:#fff;color:var(--ink2);box-shadow:0 0 0 1.5px var(--line) inset,0 3px 0 var(--shadow)}
.btn.ghost:active{box-shadow:0 0 0 1.5px var(--line) inset,0 1px 0 var(--shadow)}
.btn.navy{background:var(--ink);box-shadow:0 4px 0 #0F2140}
.chip{border-radius:14px;padding:8px 14px;font-size:15px;font-weight:600;background:#fff;color:var(--ink2);
  border:1.5px solid var(--line);transition:transform .08s;white-space:nowrap}
.chip:active{transform:scale(.95)}
.chip.on{color:#fff}
.tag{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0;border-radius:10px;padding:3px 9px;font-size:12.5px;font-weight:600}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--ink3)}

/* ---------- word pieces (phonics) ---------- */
.wordbox{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.part{border-radius:20px;padding:12px 20px;font-weight:700;line-height:1;display:flex;flex-direction:column;
  align-items:center;gap:5px;transition:transform .1s;font-size:46px}
.part:active{transform:scale(.94)}
.part small{font-size:14px;font-weight:600;opacity:.75}
.op{font-size:32px;font-weight:700;color:var(--ink3)}
.tile{width:70px;height:74px;border-radius:18px;display:flex;align-items:center;justify-content:center;
  font-size:38px;font-weight:700;transition:transform .1s}
.tile:active{transform:scale(.93)}
.slot{width:70px;height:74px;border-radius:18px;border:2.5px dashed var(--line2);display:flex;
  align-items:center;justify-content:center;font-size:38px;font-weight:700}

/* ---------- lists / options ---------- */
.rowlist{display:flex;flex-direction:column;gap:8px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.opt{display:flex;align-items:center;gap:12px;border-radius:18px;border:2px solid var(--line);
  background:#fff;padding:12px 16px;font-size:20px;font-weight:600;transition:transform .08s}
.opt:active{transform:scale(.985)}
.opt .badge{width:32px;height:32px;border-radius:11px;background:var(--line2);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:16px;font-weight:700;flex:0 0 auto}
.opt .th{font-size:14.5px;color:var(--ink3);font-weight:500}
.msg{font-size:18px;font-weight:600;min-height:26px}

/* ---------- story ---------- */
.story{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;font-size:26px;line-height:1.8;padding:4px;font-weight:500}
.sline{border-radius:14px;padding:3px 8px;margin-bottom:2px}
.sline.on{background:var(--gold-t)}
.w{border-radius:9px;padding:1px 3px;display:inline-block}
.w.hasdef{border-bottom:3px solid #F5C8A8}
.w.on{background:var(--orange-t)}

/* ---------- scene / race ---------- */
.scene{position:relative;flex:1 1 auto;min-height:0;border-radius:22px;overflow:hidden;border:1.5px solid var(--line)}
.obj{position:absolute;line-height:1;transition:filter .2s}
.lane{position:relative;height:100%;border-radius:14px;background:#fff;border:1.5px solid var(--line);overflow:hidden}
.lane .road{position:absolute;left:0;right:0;top:50%;height:4px;transform:translateY(-50%);
  background:repeating-linear-gradient(90deg,var(--line) 0 20px,transparent 20px 40px)}
.car{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:32px;transition:left .5s cubic-bezier(.34,1.3,.64,1)}
.lanename{position:absolute;left:12px;top:4px;font-size:12.5px;font-weight:700}
.flag{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:20px;opacity:.5}

/* ---------- hub / dashboard ---------- */
.hubgrid{display:grid;gap:14px}
.hcard{background:#fff;border:1.5px solid var(--line);border-radius:22px;box-shadow:var(--lift);overflow:hidden;
  display:flex;flex-direction:column;text-align:left;transition:transform .1s;min-height:0}
.hcard:active{transform:translateY(3px)}
.hcard .band{height:10px;flex:0 0 auto}
.hcard .body{padding:14px 16px 14px;display:flex;flex-direction:column;gap:4px;flex:1;min-height:0}
.hcard .ic{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto}
.hcard h3{font-size:19px;font-weight:700;line-height:1.15}
.hcard p{font-family:"Mali",sans-serif;font-size:13.5px;color:var(--ink2);line-height:1.35}
.bar{height:8px;border-radius:4px;background:#EDF1F7;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.ring{position:relative;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
  font-size:22px;font-weight:700;line-height:1}
.ring small{font-size:11px;font-weight:600;color:var(--ink3);margin-top:2px}

/* ---------- picture plate ---------- */
.pic{display:inline-flex;align-items:center;justify-content:center;line-height:1;flex:0 0 auto}
.pic svg{width:100%;height:100%}
.pic.glyph{font-weight:700;color:var(--ink);border-radius:22%;background:#F1F4F9}
.pic.swatch{border-radius:50%;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 0 0 3px #fff,0 0 0 4.5px var(--line2)}

/* ---------- quiz ---------- */
.qopt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:22px;
  border:2.5px solid var(--line);background:#fff;padding:14px 12px;font-size:24px;font-weight:600;transition:transform .08s;min-height:0}
.qopt:active{transform:scale(.97)}
.qopt.sel{border-color:var(--blue);background:var(--blue-t)}
.qopt.ok{border-color:var(--ok);background:var(--ok-t)}
.qopt.bad{border-color:var(--bad);background:var(--bad-t)}
.blank{display:inline-block;min-width:150px;border-bottom:4px solid var(--orange);color:var(--orange-d);text-align:center;margin:0 4px;padding:0 8px}
.progress{height:10px;border-radius:5px;background:#E6ECF4;overflow:hidden;flex:1}
.progress i{display:block;height:100%;background:var(--orange);border-radius:5px;transition:width .3s}

/* ---------- keyboard (spelling) ---------- */
.kbd{display:flex;flex-direction:column;gap:7px;align-items:center}
.kbd .krow{display:flex;gap:7px}
.key{width:56px;height:56px;border-radius:15px;background:#fff;border:1.5px solid var(--line2);box-shadow:0 3px 0 var(--shadow);
  font-size:26px;font-weight:600;display:flex;align-items:center;justify-content:center}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.key.wide{width:auto;padding:0 16px;font-size:17px}
.lslot{width:50px;height:62px;border-radius:14px;background:#fff;border:2px solid var(--line2);display:flex;align-items:center;
  justify-content:center;font-size:34px;font-weight:600}
.lslot.cur{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-t)}
.lslot.ok{border-color:var(--ok);background:var(--ok-t);color:var(--ok)}
.lslot.bad{border-color:var(--bad);background:var(--bad-t);color:var(--bad)}
.lslot.gap{border:none;background:none;width:20px}

/* ---------- memory ---------- */
.mem{border-radius:20px;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:600;transition:transform .15s,background .15s;min-height:0}
.mem.down{background:linear-gradient(135deg,var(--orange) 0%,#F4934F 100%);border-color:transparent}
.mem.done{opacity:.35}

/* ---------- animations ---------- */
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,255,255,0))}50%{filter:drop-shadow(0 0 14px rgba(255,200,0,.9))}}
.pop{animation:pop .4s}.bob{animation:bob 1.8s ease-in-out infinite}
.shake{animation:shake .5s}.float{animation:float 3.6s ease-in-out infinite}.glow{animation:glow 1.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- modal ---------- */
.sheet{position:fixed;inset:0;background:rgba(30,53,87,.42);display:flex;align-items:center;justify-content:center;z-index:50}
.sheetbox{width:min(720px,92vw);max-height:88vh;overflow-y:auto;background:var(--paper);border-radius:28px;
  padding:26px;box-shadow:0 24px 60px rgba(30,53,87,.3)}
.field{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.field label{width:172px;font-size:16px;font-weight:600;color:var(--ink2);flex:0 0 auto;font-family:"Mali",sans-serif}
.field input[type=text],.field select{flex:1;font:inherit;font-size:17px;font-weight:500;padding:10px 14px;
  border-radius:14px;border:1.5px solid var(--line2);background:#fff;color:var(--ink);min-width:0}
.field input[type=range]{flex:1;accent-color:var(--orange)}
.switch{width:62px;height:34px;border-radius:17px;background:var(--line2);position:relative;transition:background .2s;flex:0 0 auto}
.switch.on{background:var(--teal)}
.switch i{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:14px;background:#fff;transition:left .2s}
.switch.on i{left:31px}

/* ---------- helpers ---------- */
.scrollx{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:3px;flex:0 0 auto}
.scrolly{overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.scrollx::-webkit-scrollbar,.rowlist::-webkit-scrollbar,.story::-webkit-scrollbar,.scrolly::-webkit-scrollbar,
.sheetbox::-webkit-scrollbar{height:6px;width:6px}
.scrollx::-webkit-scrollbar-thumb,.rowlist::-webkit-scrollbar-thumb,.story::-webkit-scrollbar-thumb,
.scrolly::-webkit-scrollbar-thumb,.sheetbox::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.hint{font-family:"Mali",sans-serif;font-size:14.5px;font-weight:500;color:var(--ink3)}
.center{display:flex;align-items:center;justify-content:center}
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.wrap{flex-wrap:wrap}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}.g16{gap:16px}
.f1{flex:1 1 auto;min-height:0;min-width:0}
.f0{flex:0 0 auto}
.tc{text-align:center}
.sm-only{display:none!important}

function phon(p){ return PHON[p] || PHON[String(p).toLowerCase()] || ['', p, '']; }
const ipaOf = p => phon(p)[0];
const sayOf = p => phon(p)[1];
const exOf  = p => phon(p)[2];
const thSnd = p => (TH_SOUND[p] || TH_SOUND[String(p).toLowerCase()] || ['',''])[0];
const thTip = p => (TH_SOUND[p] || TH_SOUND[String(p).toLowerCase()] || ['',''])[1];
/* แยกคำเป็นชิ้นเสียง — ไม่ระบุ = แยกทีละตัวอักษร */
function pieces(word, given){
  const src = (given && given.length) ? given : String(word).split('');
  return src.map(p => ({t:p, ipa:ipaOf(p), say:sayOf(p)}));
}

const FEMALE_HINTS = ['samantha','karen','moira','tessa','fiona','serena','allison','ava','susan','nicky',
  'kate','martha','zira','aria','jenny','michelle','google us english','google uk english female','female','woman'];
const MALE_RE = /male|david|daniel|alex|fred|george|james|mark|guy|arthur|oliver|rishi|tom|aaron|gordon|eddy|reed|rocko|grandpa|ryan/i;

const Voice = {
  list:[], picked:null,
  refresh(){
    try{ this.list = (window.speechSynthesis.getVoices()||[]).filter(v=>/^en(-|_)/i.test(v.lang||'')); }
    catch(e){ this.list = []; }
    if (S.voiceURI){
      const forced = this.list.find(v=>v.voiceURI===S.voiceURI);
      if (forced){ this.picked=forced; this.paint(); return; }
    }
    let pick=null;
    for (const hint of FEMALE_HINTS){ pick=this.list.find(v=>(v.name||'').toLowerCase().includes(hint)); if(pick)break; }
    if(!pick) pick=this.list.find(v=>!MALE_RE.test(v.name||''));
    if(!pick) pick=this.list[0]||null;
    this.picked=pick; this.paint();
  },
  paint(){
    const el=document.getElementById('voicePill'); if(!el) return;
    el.textContent = voiceLabel();
  },
  utter(text, rate, pitch){
    try{
      const u=new SpeechSynthesisUtterance(String(text));
      if(this.picked){ u.voice=this.picked; u.lang=this.picked.lang; } else u.lang='en-US';
      u.rate  = rate!=null ? rate : S.rate;
      u.pitch = pitch!=null ? pitch : 1.22;
      window.speechSynthesis.speak(u);
      return u;
    }catch(e){ return null; }
  },
  stop(){ try{ window.speechSynthesis.cancel(); }catch(e){} },
  say(text, rate){ this.stop(); return this.utter(text, rate!=null?rate*S.rate/0.85:undefined); },
  /* พูดต่อกันเป็นลำดับ พร้อม callback ทีละชิ้น */
  sequence(items, onStep, onDone){
    this.stop();
    let i=0;
    const step=()=>{
      if(i>=items.length){ if(onDone) onDone(); return; }
      const it=items[i];
      if(onStep) onStep(i,it);
      const u=this.utter(it.text, it.rate);
      if(!u){ i++; setTimeout(step,260); return; }
      u.onend  =()=>{ i++; setTimeout(step, it.gap!=null?it.gap:180); };
      u.onerror=()=>{ i++; setTimeout(step,200); };
    };
    step();
  },
  /* ★ หัวใจ: ออกเสียงโฟนิกส์  c … at … c-at … cat ★ */
  phonics(word, parts, onStep, onDone){
    const ps=pieces(word,parts);
    const slow=Math.max(.3, S.rate-.30), mid=Math.max(.3, S.rate-.32), full=Math.max(.4, S.rate-.06);
    const seq=ps.map(p=>({text:p.say, rate:slow, gap:Math.round(250/S.rate)}));
    seq.push({text:ps.map(p=>p.say).join(' '), rate:mid, gap:Math.round(280/S.rate)});
    seq.push({text:word, rate:full, gap:0});
    this.sequence(seq,onStep,onDone);
  }
};

/* ---- ทบทวนแบบเว้นระยะ (Leitner) — Cepeda et al. 2006; Webb 2007 ----
   ทุกคำมี "กล่อง" 0–5: ตอบถูกครั้งแรกของวัน → เลื่อนขึ้น 1 กล่อง และนัดทบทวนครั้งต่อไปตามระยะห่าง
   ตอบผิด → ลดลง 1 กล่องและนำกลับมาทบทวนทันที · กล่องเลื่อนได้วันละครั้งเท่านั้น (บังคับให้เว้นระยะจริง)
   จำได้ (learned) = กล่อง ≥ 1 · จำได้ระยะยาว (mastered) = กล่อง ≥ 3 คือถูกต้องอย่างน้อย 3 วันที่ต่างกัน */
const BOX_DAYS=[0,1,2,4,7,14], DAY_MS=86400000;
const todayKey=()=>new Date().toDateString();
function wrec(id){
  const r=P.w[id]||(P.w[id]={ok:0,bad:0});
  if(r.box==null){ r.box=r.ok>0?1:0; r.due=0; r.last=''; }
  return r;
}
function record(word, type, ok){
  if(word && word.id){
    const r=wrec(word.id);
    if(ok){ r.ok++;
      if(r.last!==todayKey()){ r.box=Math.min(5,r.box+1); r.last=todayKey(); r.due=Date.now()+BOX_DAYS[r.box]*DAY_MS; } }
    else { r.bad++; r.box=Math.max(0,r.box-1); r.due=0; }
  }
  const sk=SKILL_OF[type]||type;
  const r2=P.skill[sk]||(P.skill[sk]={ok:0,n:0}); r2.n++; if(ok) r2.ok++;
  saveProg();
}
const boxOf    = w=>{ const r=P.w[w.id]; return r ? (r.box!=null?r.box:(r.ok>0?1:0)) : 0; };
const mastered = w=>boxOf(w)>=3;
const learned  = w=>boxOf(w)>=1;
const isDue    = w=>{ const r=P.w[w.id]; return !!r && r.box>0 && (r.due||0)<=Date.now(); };
const setPct   = set=>Math.round(100*set.words.filter(mastered).length/set.words.length);
const skillPct = k=>{ const r=P.skill[k]; return r&&r.n ? Math.round(100*r.ok/r.n) : null; };
const bestExam = ()=>P.exams.length ? Math.max(...P.exams.map(e=>Math.round(100*e.score/e.n))) : null;

/* สลับตัวเลือกแบบคงที่ต่อข้อ (ไม่เด้งตอน re-render) แต่กระจายดี */
function shuffleStable(arr, seed){
  const b=arr.slice();
  let t=(seed+1)>>>0;
  t=Math.imul(t^(t>>>16),0x45D9F3B)>>>0; t=Math.imul(t^(t>>>16),0x45D9F3B)>>>0; t=(t^(t>>>16))>>>0;
  const rnd=()=>{ t=(t+0x6D2B79F5)>>>0; let x=Math.imul(t^(t>>>15),1|t); x=(x+Math.imul(x^(x>>>7),61|x))^x;
    return ((x^(x>>>14))>>>0)/4294967296; };
  for(let i=b.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; }
  return b;
}
function star(n){
  if(!n) return;
  S.stars+=n; const e=$('#starCount');
  if(e){ e.textContent=S.stars; const p=e.parentElement; p.classList.remove('pop'); void p.offsetWidth; p.classList.add('pop'); }
  save();
}

function pic(w, size){
  size=size||64;
  if(w.svg) return `<span class="pic" style="width:${size}px;height:${size}px">${ART[w.svg]}</span>`;
  if(w.sw)  return `<span class="pic swatch" style="width:${size*.82}px;height:${size*.82}px;background:${w.sw}"></span>`;
  if(w.e)   return `<span class="pic" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.78)}px">${w.e}</span>`;
  const g=w.g||w.w, fs=g.length>4?size*.26:g.length>2?size*.36:size*.5;
  return `<span class="pic glyph" style="width:${size}px;height:${size}px;font-size:${Math.round(fs)}px">${esc(g)}</span>`;
}

function sectionOf(scr){
  if(scr==='quiz')   return S.quiz ? S.quiz.section : 'exam';

  if(scr==='memory') return S.mem ? S.mem.section : 'vocab';

function backOf(scr){

  return PARENT[scr]||null;

function go(screen){
  Voice.stop();
  S.screen=screen;
  if(screen==='phonics'){ S.famIdx=0; S.wordIdx=0; }
  if(screen==='wall'){ S.wallIdx=0; S.wallKey=''; }
  if(screen==='scramble') loadScramble(0);
  if(screen==='missing'){ S.misIdx=0; S.misPick=null; }
  if(screen==='circle'){ S.cirIdx=0; S.cirPick=null; }
  if(screen==='match') loadMatch(S.matMode);
  if(screen==='sort') loadSort(0);
  if(screen==='read'){ S.storyTab='read'; S.qIdx=0; S.qPick=null; S.tipWord=null; S.readLine=-1; }
  if(screen==='yesno'){ S.ynIdx=0; S.ynPick=null; }
  if(screen==='sight') loadSight(0);
  if(screen==='colour') loadColour();
  if(screen==='find'){ S.findSel=null; S.findGot={}; S.findMsg=''; }
  if(screen==='race') resetRace();
  render();
}

ACT.sound    = d=>{
  const say=sayOf(d.k), ex=exOf(d.k), slow=Math.max(.3,S.rate-.3);
  if(ex) Voice.sequence([{text:say,rate:slow,gap:Math.round(300/S.rate)},{text:say,rate:slow,gap:Math.round(300/S.rate)},
    {text:ex,rate:Math.max(.4,S.rate-.06),gap:0}]);
  else Voice.say(say,.5);
};
/* อ่านช้า ๆ ทีละพยางค์ไม่ได้กับคำยาว → อ่านช้า แล้วสะกดชื่อตัวอักษรทีละตัว */
ACT.spellout = d=>{
  const w=d.w, letters=w.replace(/ /g,'').split('');
  Voice.sequence([{text:w,rate:Math.max(.4,S.rate-.15),gap:350}]
    /* ตัวพิมพ์ใหญ่ทำให้ TTS อ่าน "ชื่อตัวอักษร" (A = เอ) ไม่ใช่เสียงคำ (a = อะ) */
    .concat(letters.map(ch=>({text:ch.toUpperCase(), rate:Math.max(.5,S.rate), gap:120})))
    .concat([{text:w,rate:Math.max(.45,S.rate-.08),gap:0}]));
};

function dailyWords(n){
  const due=shuffle(CORE.filter(isDue));
  const weak=shuffle(CORE.filter(w=>!isDue(w)&&!mastered(w)&&(P.w[w.id]||{}).bad>0));
  const fresh=CORE.filter(w=>!P.w[w.id]);               /* คำใหม่ตามลำดับ Unit */
  const rest=shuffle(CORE.filter(w=>!mastered(w)));
  const out=[], seen=new Set();
  for(const w of due.concat(weak,fresh,rest,shuffle(CORE))){ if(out.length>=n) break; if(!seen.has(w.id)){ seen.add(w.id); out.push(w); } }
  return out;
}

/* ═════════════════════════════════════════════════════════════════════

/* เลือกตัวลวง: คำอื่นที่ความหมายไม่ซ้ำกัน */
function distract(w, pool, n){
  const out=[], seen=new Set([w.w.toLowerCase(), w.th]);
  for(const x of shuffle(pool)){
    if(out.length>=n) break;
    if(seen.has(x.w.toLowerCase())||seen.has(x.th)) continue;
    seen.add(x.w.toLowerCase()); seen.add(x.th); out.push(x);
  }
  return out;
}
function optsFor(w,pool,n){ const o=shuffle([w].concat(distract(w,pool.length>=n?pool:CORE,n-1))); return {opts:o, a:o.indexOf(w)}; }
function mkListen(w,pool){ const usePic=hasPic(w); const p=(pool||CORE).filter(x=>usePic?hasPic(x):true);
  const {opts,a}=optsFor(w,p,4); return {type:'listen',word:w,opts:opts.map(x=>({w:x,pic:usePic})),a,say:w.w}; }
function mkPic(w,pool){ const {opts,a}=optsFor(w,pool||CORE,4); return {type:'pic',word:w,opts:opts.map(x=>({w:x})),a}; }
function mkMean(w,pool){ const {opts,a}=optsFor(w,pool||CORE,4); return {type:'mean',word:w,opts:opts.map(x=>({t:x.th,thai:true})),a,say:w.w}; }
function mkTh2En(w,pool){ const {opts,a}=optsFor(w,pool||CORE,4); return {type:'th2en',word:w,opts:opts.map(x=>({w:x})),a}; }
function mkBlank(b){ const o=shuffle(b.o); return {type:'blank',s:b.s,opts:o.map(t=>({t})),a:o.indexOf(b.a),word:coreWord(b.a),full:b.s.replace('___',b.a)}; }
function mkGram(g,it){ const o=shuffle(it.o); return {type:'gram',s:it.s,h:it.h,lesson:g.key,lessonTitle:g.title,opts:o.map(t=>({t})),a:o.indexOf(it.a),
  full:it.s==='Which is correct?'?it.a:it.s.replace('👇 ','').replace('👉 ','').replace('___',it.a)}; }
function mkMissing(w){
  const letters=w.w.split(''); const vow=[], cons=[];
  letters.forEach((ch,i)=>{ if(ch===' ') return; (/[aeiou]/i.test(ch)?vow:cons).push(i); });
  const idx=(vow.length?pickN(vow,1):pickN(cons,1))[0], ch=letters[idx].toLowerCase();
  const pool=(/[aeiou]/.test(ch)?'aeiou':'bcdfghklmnprstw').split('').filter(x=>x!==ch);
  const o=shuffle([ch].concat(pickN(pool,2)));
  return {type:'missing',word:w,idx,opts:o.map(t=>({t})),a:o.indexOf(ch)};
}
function mkOdd(it){ const o=shuffle(it.o); return {type:'odd',opts:o.map(t=>({t,w:CORE.find(w=>w.w===t)||SETS.flatMap(s=>s.words).find(w=>w.w===t)})),a:o.indexOf(it.a)}; }
function mkRead(p,qi){ const q=p.q[qi]; return {type:'read',passage:p,q:q.q,opts:q.o.map(t=>({t})),a:q.a}; }
function misspell(word){
  const w=word, out=new Set(), L=w.length;
  const vsw={a:'e',e:'i',i:'e',o:'u',u:'o'};
  for(let t=0;t<60&&out.size<4;t++){
    const r=(Math.random()*4)|0, i=1+((Math.random()*(L-2))|0);
    let v=w;
    if(r===0&&w[i]!==' '&&w[i+1]&&w[i+1]!==' ') v=w.slice(0,i)+w[i+1]+w[i]+w.slice(i+2);
    if(r===1&&w[i]!==' ') v=w.slice(0,i)+w.slice(i+1);
    if(r===2&&w[i]!==' ') v=w.slice(0,i)+w[i]+w.slice(i);
    if(r===3&&vsw[w[i]]) v=w.slice(0,i)+vsw[w[i]]+w.slice(i+1);
    if(v!==w&&v.indexOf('  ')<0) out.add(v);
  }
  return [...out];
}
function mkFix(right, wrong){
  const w=SETS.flatMap(s=>s.words).find(x=>x.w===right)||{w:right,e:(MISTAKES.find(m=>m.right===right)||{}).e};
  const wrongs=(wrong?[wrong]:[]).concat(misspell(right).filter(x=>x!==wrong)).slice(0,2);
  const o=shuffle([right].concat(wrongs));
  return {type:'fix',word:w.id?w:null,shown:w,opts:o.map(t=>({t})),a:o.indexOf(right),say:right};
}

function startQuiz(cfg){

}

  const it=q.items[q.i];

}

  missing:'ตัวอักษรที่หายไปคือตัวไหน',odd:'คำไหนไม่เข้าพวก',read:'อ่านเรื่อง แล้วตอบคำถาม',fix:'คำไหนสะกดถูก'};

VIEWS.quiz = ()=>{
  const q=S.quiz; if(!q) return VIEWS.home();
  if(q.done) return quizResults();
  const it=q.items[q.i], pick=q.picks[q.i], answered=pick!==null;
  const reveal=answered && !q.exam;
  const n=q.items.length, pct=Math.round(100*(q.i+(answered?1:0))/n);
  const score=q.picks.filter((p,i)=>p!==null&&p===q.items[i].a).length;
  const head=`
    <div class="row g12 f0 nowrap" style="margin-bottom:10px">
      ${it.partLabel?`<span class="tag" style="background:var(--ink);color:#fff;font-size:13.5px;padding:5px 11px">${esc(it.partLabel)}</span>`:''}
      <span style="font-size:16px;font-weight:600">Question ${q.i+1} / ${n}</span>
      <div class="progress"><i style="width:${pct}%"></i></div>
      ${q.exam?`<span class="hint">ข้อสอบจำลอง · ไม่เฉลยระหว่างทำ</span>`:`<span class="tag" style="background:var(--ok-t);color:var(--ok)">✔ ${score}</span>`}
    </div>`;
  /* --- prompt --- */
  let prompt='';
  const w=it.word;
  const sayBtn=t=>`<button class="btn lg" data-act="say" data-t="${esc(t)}" data-r="0.78" style="border-radius:50%;width:104px;height:104px;padding:0;font-size:44px">🔊</button>`;
  if(it.type==='listen') prompt=`<div class="col g10 center">${sayBtn(w.w)}<div class="hint">แตะเพื่อฟังอีกครั้ง</div></div>`;
  if(it.type==='pic')    prompt=`<div class="center">${pic(w,150)}</div>`;
  if(it.type==='mean')   prompt=`<div class="col g8 center"><div class="qword" style="font-size:58px;font-weight:700;color:var(--ink)">${esc(w.w)}</div>
                            <button class="chip" data-act="say" data-t="${esc(w.w)}" data-r="0.78">🔊 Listen</button></div>`;
  if(it.type==='th2en')  prompt=`<div class="col g8 center"><div class="thai qword" style="font-size:46px;font-weight:600;color:var(--ink)">${esc(w.th)}</div>
                            ${hasPic(w)?`<div style="opacity:.9">${pic(w,70)}</div>`:''}</div>`;
  if(it.type==='blank'||it.type==='gram'){
    const filled = reveal ? `<span class="blank" style="border-color:${pick===it.a?'var(--ok)':'var(--bad)'};color:${pick===it.a?'var(--ok)':'var(--bad)'}">${esc(it.opts[it.a].t)}</span>`
      : (answered ? `<span class="blank" style="border-color:var(--blue);color:var(--blue-d)">${esc(it.opts[pick].t)}</span>` : `<span class="blank">&nbsp;</span>`);
    const sent = it.s==='Which is correct?' ? `<div style="font-size:40px;font-weight:600">Which is correct?</div>`
      : `<div class="qsent" style="font-size:40px;font-weight:600;line-height:1.5;text-align:center;max-width:860px">${esc(it.s).replace('___',filled)}</div>`;
    prompt=`<div class="col g10 center">${it.lessonTitle?`<span class="tag" style="background:var(--teal-t);color:var(--teal-d)">${esc(it.lessonTitle)}</span>`:''}
      ${sent}${it.h?`<span class="tag" style="background:var(--purple-t);color:var(--purple-d);font-size:14px">${esc(it.h)}</span>`:''}</div>`;
  }
  if(it.type==='missing'){
    const shown=w.w.split('').map((ch,i)=>i===it.idx
      ? `<span style="display:inline-block;min-width:44px;border-bottom:5px solid var(--orange);color:${reveal?(pick===it.a?'var(--ok)':'var(--bad)'):'var(--orange-d)'}">${reveal?esc(it.opts[it.a].t):(answered?esc(it.opts[pick].t):'?')}</span>`
      : (ch===' '?'&nbsp;&nbsp;':esc(ch))).join('');
    prompt=`<div class="col g10 center">${hasPic(w)?pic(w,110):''}<div class="qword" style="font-size:54px;font-weight:600;letter-spacing:4px">${shown}</div>
      <button class="chip" data-act="say" data-t="${esc(w.w)}" data-r="0.72">🔊 Listen</button></div>`;
  }
  if(it.type==='odd') prompt=`<div class="center" style="font-size:30px;font-weight:600">Which one is different?</div>`;
  if(it.type==='fix') prompt=`<div class="col g10 center">${it.shown&&hasPic(it.shown)?pic(it.shown,110):''}
      <button class="chip" data-act="say" data-t="${esc(it.say)}" data-r="0.72">🔊 Listen</button></div>`;
  if(it.type==='read') prompt=`<div style="font-size:28px;font-weight:600;line-height:1.3">${esc(it.q)}</div>`;

  /* --- options --- */
  const tried=(q.tries&&q.tries[q.i])||[];
  const cls=i=>{ if(reveal){ if(i===it.a) return 'ok'; if(i===pick||tried.includes(i)) return 'bad'; return ''; }
    if(tried.includes(i)) return 'bad'; return answered&&i===pick?'sel':''; };
  const optHTML=(o,i)=>{
    let inner='';
    if(it.type==='listen' && o.pic) inner=pic(o.w,92)+(reveal?`<span style="font-size:18px">${esc(o.w.w)}</span>`:'');
    else if(it.type==='odd' && o.w && hasPic(o.w)) inner=pic(o.w,64)+`<span>${esc(o.t)}</span>`;
    else if(o.w) inner=`<span style="font-size:${o.w.w.length>12?22:28}px">${esc(o.w.w)}</span>`;
    else inner=`<span class="${o.thai?'thai':''}" style="font-size:${o.thai?24:(it.type==='missing'?44:26)}px">${esc(o.t)}</span>`;
    return `<button class="qopt ${cls(i)} ${reveal&&i===pick&&i!==it.a?'shake':''}" data-act="qzpick" data-i="${i}">${inner}</button>`;
  };
  const nOpt=it.opts.length;
  const cols = it.type==='listen'||it.type==='odd' ? 4 : (isXs()&&it.type==='fix' ? 1 : (nOpt===2?2:nOpt===3?3:2));
  const optsGrid=`<div data-rg="${cols}" style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:12px">${it.opts.map(optHTML).join('')}</div>`;

  /* --- feedback / next --- */
  let fb='';
  if(reveal){
    const ok=pick===it.a, second=ok&&tried.length>0;
    const correctText = it.type==='mean'? it.opts[it.a].t : (it.opts[it.a].w? it.opts[it.a].w.w : it.opts[it.a].t);
    const pr=praiseFor(it.type);
    fb=`<div class="msg" style="color:${ok?'var(--ok)':'var(--bad)'}">${
      ok ? (second?'✔ You got it! <span class="thai hint">ถูกต้องในครั้งที่สอง — ตั้งใจดีมาก</span>'
                  :'✔ '+pr[0]+' <span class="thai hint">'+pr[1]+'</span>')
         : '✘ Not quite. The answer is “'+esc(correctText)+'” <span class="thai hint">ฟังอีกครั้งแล้วจำไว้นะ</span>'}
      ${w&&!['blank','gram','read'].includes(it.type)&&S.showThai?`<span class="thai hint"> · ${esc(w.w)} = ${esc(w.th)}</span>`:''}</div>`;
  } else if(tried.length && !q.exam){
    fb=`<div class="msg" style="color:var(--gold-d)">↺ Try again! <span class="thai hint">ยังไม่ถูก ลองอีกครั้ง — ตัวเลือกที่ผิดถูกปิดไว้แล้ว</span></div>`;
  }
  const nextBtn=`<button class="btn ${answered?'':'ghost'}" data-act="qznext" ${answered?'':'disabled style="opacity:.45"'}>${q.i===n-1?'Finish ✓':'Next ▶'}</button>`;

  if(it.type==='read'){
    const p=it.passage;
    return head+`<div class="row g14 f1 split" style="align-items:stretch">
      <div class="card col" data-side style="width:46%;flex:0 0 auto;border-top:6px solid ${C(p.c)}">
        <div class="row g10" style="margin-bottom:6px"><span style="font-size:30px">${p.emoji}</span>
          <div style="font-size:24px;font-weight:700;color:${C(p.c+'-d')}">${esc(p.title)}</div><span class="spacer"></span>
          <button class="chip" data-act="readpass">🔊 Read</button></div>
        <div class="scrolly f1" style="font-size:22px;line-height:1.7;font-weight:500">${p.text.map(t=>`<div data-act="say" data-t="${esc(t)}" style="cursor:pointer">${esc(t)}</div>`).join('')}</div>
      </div>
      <div class="card col g14 f1" style="justify-content:center">
        <div class="hint">${PROMPT_TH.read}</div>${prompt}
        <div class="col g10">${it.opts.map((o,i)=>`<button class="opt ${reveal&&i===pick&&i!==it.a?'shake':''}" data-act="qzpick" data-i="${i}"
          style="${reveal?(i===it.a?'border-color:var(--ok);background:var(--ok-t)':i===pick?'border-color:var(--bad);background:var(--bad-t)':''):(answered&&i===pick?'border-color:var(--blue);background:var(--blue-t)':'')}">
          <span class="badge" style="background:${reveal&&i===it.a?'var(--ok)':'var(--line2)'}">${'abc'[i]}</span><span class="f1">${esc(o.t)}</span></button>`).join('')}</div>
        ${fb}<div class="row">${'<span class="spacer"></span>'+nextBtn}</div>
      </div></div>`;
  }
  return head+`<div class="card f1 col g14" style="justify-content:space-between;padding:18px 26px">
      <div class="col g4 center"><div style="font-size:21px;font-weight:600;color:var(--ink2)">${PROMPT_LABEL[it.type]}</div>
        <div class="hint">${PROMPT_TH[it.type]}</div></div>
      <div class="f1 center" style="min-height:0">${prompt}</div>
      ${optsGrid}
      <div class="row g10" style="min-height:48px">${fb}<span class="spacer"></span>${nextBtn}</div>
    </div>`;
};
ACT.readpass=()=>{ const it=S.quiz.items[S.quiz.i]; Voice.sequence(it.passage.text.map(t=>({text:t,rate:Math.max(.45,S.rate),gap:260}))); };
/* คำชมเชิงกระบวนการ (ชมความตั้งใจ ไม่ชมว่า "ฉลาด") — Mueller & Dweck, 1998 */
const PRAISE={listen:['Great listening!','ตั้งใจฟังดีมาก'], read:['You read carefully!','อ่านอย่างตั้งใจ'],
  gram:['Good thinking!','คิดอย่างรอบคอบ'], blank:['Good thinking!','คิดอย่างรอบคอบ'], missing:['Careful spelling!','สะกดอย่างตั้งใจ'],
  fix:['Careful spelling!','สะกดอย่างตั้งใจ'], spell:['Careful spelling!','สะกดอย่างตั้งใจ'], pic:['Sharp eyes!','สังเกตได้ดีมาก'],
  odd:['Good thinking!','คิดอย่างรอบคอบ'], mean:['Well remembered!','จำได้แม่นยำ'], th2en:['Well remembered!','จำได้แม่นยำ']};
const praiseFor=t=>PRAISE[t]||['Nice work!','ทำได้ดีมาก'];
/* แบบฝึก: ตอบผิดครั้งแรก → ปิดตัวเลือกนั้น ให้ลองใหม่ 1 ครั้ง (scaffolding — Wood, Bruner & Ross, 1976)
   บันทึกผลเฉพาะ "ครั้งแรก" เพื่อให้ระบบทบทวนเว้นระยะสะท้อนความจำจริง
   ข้อสอบจำลอง: ไม่เฉลยระหว่างทำ เปลี่ยนคำตอบได้ก่อนกด Next */
ACT.qzpick=d=>{
  const q=S.quiz, it=q.items[q.i], i=+d.i;
  if(q.exam){ q.picks[q.i]=i; render(); return; }
  if(q.picks[q.i]!==null) return;
  q.tries=q.tries||{}; q.first=q.first||{};
  const tried=q.tries[q.i]||[];
  if(tried.includes(i)) return;
  const ok=i===it.a;
  if(!ok && !tried.length && it.opts.length>2){
    q.tries[q.i]=[i]; q.first[q.i]=false;
    record(it.word,it.type,false);
    Voice.say('Try again.',.85);
    if(it.say) setTimeout(()=>Voice.utter(it.say,Math.max(.4,S.rate-.12)),900);
    render(); return;
  }
  q.picks[q.i]=i;
  if(!tried.length){ record(it.word,it.type,ok); q.first[q.i]=ok; }
  if(ok){ if(!tried.length) star(1);
    Voice.say(praiseFor(it.type)[0]+' '+(it.full||(it.word?it.word.w:'')),.8); }
  else Voice.say(it.full||(it.word?it.word.w:(it.opts[it.a].t||'')),.72);
  render();
};
ACT.qznext=()=>{
  const q=S.quiz; if(q.picks[q.i]===null) return;
  if(q.i<q.items.length-1){ q.i++; render(); quizAuto(); return; }
  finishQuiz();
};
function finishQuiz(){
  const q=S.quiz; q.done=true;
  const finalOk=q.picks.filter((p,i)=>p===q.items[i].a).length;
  /* แบบฝึก: คะแนน = ถูกในครั้งแรก · ถูกในครั้งที่สองแสดงแยก */
  q.score = q.exam ? finalOk : q.items.filter((_,i)=>(q.first||{})[i]===true).length;
  q.second = q.exam ? 0 : finalOk-q.score;
  if(q.exam){
    q.items.forEach((it,i)=>record(it.word,it.type,q.picks[i]===it.a));
    const parts={}; q.items.forEach((it,i)=>{ const k=it.part; parts[k]=parts[k]||[0,0]; parts[k][1]++; if(q.picks[i]===it.a) parts[k][0]++; });
    P.exams.push({d:Date.now(),score:q.score,n:q.items.length,parts}); saveProg();
    star(Math.round(q.score/3));
  }
  if(q.test){ P.unitTest[q.setKey]=Math.max(P.unitTest[q.setKey]||0,Math.round(100*q.score/q.items.length)); saveProg(); }
  if(q.gramKey){ P.gram[q.gramKey]=Math.max(P.gram[q.gramKey]||0,Math.round(100*q.score/q.items.length)); saveProg(); }
  if(q.score===q.items.length) star(3);
  render();
  const pct=q.score/q.items.length;
  Voice.say(pct>=.9?'Excellent work, '+S.kidName+'!':pct>=.7?'Good progress! Keep it up.':'You kept trying. Let us practise again.',.85);
}
function quizResults(){
  const q=S.quiz, n=q.items.length, pct=Math.round(100*q.score/n);
  const grade=pct>=90?['Excellent work!','ฝึกมาอย่างดี พร้อมสำหรับการสอบ']:pct>=70?['Good progress!','ทบทวนข้อที่ยังไม่ถูกอีกเล็กน้อย']
    :pct>=50?['Keep practising!','ฝึกต่อวันละนิด จะจำได้แม่นยำขึ้น']:['Let’s practise together!','ค่อย ๆ ฝึกไปด้วยกัน ทีละขั้น'];
  /* ข้อที่ควรทบทวน: ข้อสอบ = ตอบผิด · แบบฝึก = ไม่ถูกในครั้งแรก (แสดงคำตอบแรกที่เลือก) */
  const wrong=q.items.map((it,i)=>({it,i,p: q.exam ? q.picks[i] : ((q.tries&&q.tries[i])? q.tries[i][0] : q.picks[i])}))
    .filter(x=> q.exam ? x.p!==x.it.a : (q.first||{})[x.i]!==true);
  const ansText=(it,k)=>{ const o=it.opts[k]; return o.w? o.w.w : o.t; };
  const qText=it=>({listen:'🔊 '+(it.word&&it.word.w),pic:'🖼️ '+(it.word&&it.word.w),mean:it.word&&it.word.w,th2en:it.word&&it.word.th,
    blank:it.s,gram:it.s==='Which is correct?'?'Which is correct?':it.s,missing:it.word&&it.word.w,odd:'Odd one out',read:it.q,fix:'Spelling: '+it.say})[it.type]||'';
  let partBars='';
  if(q.exam){
    const last=P.exams[P.exams.length-1];
    partBars=`<div class="col g8">${EXAM_PARTS.map(pt=>{ const r=last.parts[pt.k]||[0,0], pp=r[1]?Math.round(100*r[0]/r[1]):0; return `
      <div class="row g10"><span style="width:200px;font-size:15px;font-weight:600">${pt.label}</span>
        <div class="f1">${barHTML(pp,pp>=80?'var(--ok)':pp>=60?C('gold'):'var(--bad)')}</div><span style="width:46px;text-align:right;font-weight:600">${r[0]}/${r[1]}</span></div>`; }).join('')}</div>`;
  }
  return `<div class="row g14 f1 split" style="align-items:stretch">
    <div class="card col g12" data-side style="width:400px;flex:0 0 auto;align-items:center;justify-content:center;text-align:center">
      ${ringHTML(pct,170,pct>=70?'#1E9E68':C('orange'),q.score+' / '+n)}
      <div style="font-size:32px;font-weight:700">${grade[0]}</div>
      <div class="thai" style="font-size:17px;color:var(--ink2)">${grade[1]}</div>
      ${!q.exam?`<div class="hint">ถูกในครั้งแรก ${q.score} ข้อ${q.second?` · ถูกในครั้งที่สอง ${q.second} ข้อ`:''}</div>`:''}
      ${partBars?`<div style="width:100%;margin-top:6px">${partBars}</div>`:''}
      <div class="row g10" style="margin-top:6px">
        <button class="btn" data-act="qzretry">↺ Try again</button>
        <button class="btn ghost" data-act="nav" data-k="${q.back||'home'}">Done</button>
      </div>
    </div>
    <div class="card col f1" style="min-width:0">
      <div class="row g8" style="margin-bottom:8px"><div class="eyebrow">Review · ข้อที่ตอบผิด</div><span class="spacer"></span>
        <span class="tag" style="background:${wrong.length?'var(--bad-t)':'var(--ok-t)'};color:${wrong.length?'var(--bad)':'var(--ok)'}">${wrong.length} ข้อ</span></div>
      ${wrong.length?`<div class="rowlist f1">${wrong.map(x=>`
        <div class="soft row g12" style="padding:10px 14px;align-items:flex-start">
          <span class="tag" style="background:var(--ink);color:#fff">${x.i+1}</span>
          <div class="col g4 f1" style="min-width:0">
            <div style="font-size:17px;font-weight:600" class="${x.it.type==='th2en'?'thai':''}">${esc(qText(x.it))}</div>
            <div style="font-size:15px"><span style="color:var(--bad)">✘ ${esc(ansText(x.it,x.p))}</span>
              &nbsp;→&nbsp;<span style="color:var(--ok);font-weight:600">✔ ${esc(ansText(x.it,x.it.a))}</span></div>
          </div>
          ${x.it.word?`<button class="chip" data-act="say" data-t="${esc(x.it.full||x.it.word.w)}">🔊</button>`:''}
        </div>`).join('')}</div>`
      :`<div class="f1 center col g10"><div style="font-size:72px" class="pop">🏆</div><div style="font-size:24px;font-weight:600">Perfect score!</div>
        <div class="hint">ถูกทุกข้อ ตั้งใจและรอบคอบมาก</div></div>`}
    </div></div>`;
}
ACT.qzretry=()=>{
  const q=S.quiz;
  if(q.rebuild) return q.rebuild();
  startQuiz(Object.assign({},q,{items:shuffle(q.items),i:0,done:false}));
};

/* ═════════════════════════════════════════════════════════════════════
   6D. FINAL EXAM — ข้อสอบจำลอง + แบบฝึกรายทักษะ
   ═════════════════════════════════════════════════════════════════════ */
const EXAM_PARTS=[
  {k:'A',label:'A · Listening',      th:'ฟังแล้วเลือกภาพ'},
  {k:'B',label:'B · Look & Choose',  th:'ดูภาพเลือกคำ + ตัวอักษรที่หายไป'},
  {k:'C',label:'C · Word ↔ Meaning', th:'คำศัพท์กับความหมาย'},
  {k:'D',label:'D · Fill in the Blank',th:'เติมคำในช่องว่าง'},
  {k:'E',label:'E · Grammar',        th:'ไวยากรณ์'},
  {k:'F',label:'F · Reading',        th:'อ่านเรื่องแล้วตอบคำถาม'}
];
function buildExam(){
  const used=new Set(), take=(pool,n)=>{ const out=[]; for(const w of shuffle(pool)){ if(out.length>=n) break; if(used.has(w.w)) continue; used.add(w.w); out.push(w); } return out; };
  const picPool=CORE.filter(hasPic);
  const tag=(arr,k)=>arr.map(it=>Object.assign(it,{part:k,partLabel:EXAM_PARTS.find(p=>p.k===k).label}));
  const A=tag(take(picPool,5).map(w=>mkListen(w,CORE)),'A');
  const B=tag(take(picPool,3).map(w=>mkPic(w,CORE)).concat(take(CORE.filter(w=>w.w.length<=9),2).map(mkMissing)),'B');
  const C_=tag(take(CORE,3).map(w=>mkMean(w,CORE)).concat(take(CORE,2).map(w=>mkTh2En(w,CORE))),'C');
  const D=tag(pickN(BLANKS.filter(b=>!used.has(b.a)),5).map(mkBlank),'D');
  const E=tag(pickN(GRAMMAR,5).map(g=>mkGram(g,pickN(g.items,1)[0])),'E');
  const p=pickN(PASSAGES,1)[0];
  const F=tag(p.q.map((_,i)=>mkRead(p,i)),'F');
  return A.concat(B,C_,D,E,F);
}
ACT.examstart=()=>startQuiz({title:'Mock Final Exam',sub:'ข้อสอบจำลองปลายภาค 30 ข้อ · 6 ตอน',items:buildExam(),exam:true,
  section:'exam',back:'exam',rebuild:()=>ACT.examstart()});
const DRILLS=[

/* ═════════════════════════════════════════════════════════════════════
   6F. SPELLING — ฟังแล้วพิมพ์ด้วยแป้นตัวอักษร a–z
   ═════════════════════════════════════════════════════════════════════ */
function startSpell(words,cfg){
  S.sp=Object.assign({list:words,i:0,typed:[],checked:null,hints:0,right:0,section:'spelling',back:'spelling'},cfg);
  Voice.stop(); S.screen='spell'; render(); setTimeout(()=>Voice.say(words[0].w,.75),280);
}
const spTarget=()=>S.sp.list[S.sp.i].w.toLowerCase();
VIEWS.spell = ()=>{
  const sp=S.sp, w=sp.list[sp.i], tgt=spTarget(), letters=tgt.replace(/ /g,'');
  const n=letters.length, slotW=Math.min(54,Math.floor(((isSm()?Math.min(window.innerWidth-70,610):610)-(tgt.split(' ').length-1)*16)/n)-6);
  let k=0;
  const slots=tgt.split('').map(ch=>{
    if(ch===' ') return `<span class="lslot gap"></span>`;
    const idx=k++, typed=sp.typed[idx]||'', cur=idx===sp.typed.length&&!sp.checked;
    const st=sp.checked? (typed===letters[idx]?'ok':'bad') : '';
    return `<span class="lslot ${st} ${cur?'cur':''}" style="width:${slotW}px;height:${Math.round(slotW*1.22)}px;font-size:${Math.round(slotW*.66)}px">${esc(typed)}</span>`;
  }).join('');
  const rows=isXs()?['abcdefg','hijklmn','opqrstu','vwxyz']:['abcdefghi','jklmnopqr','stuvwxyz'];
  const allOk=sp.checked && sp.typed.join('')===letters;
  return `<div class="row g14 f1 split" style="align-items:stretch">
    <div class="card col g10" data-side style="width:330px;flex:0 0 auto;align-items:center;justify-content:center;text-align:center">
      <span class="tag" style="background:#EEF2F8;color:var(--ink2)">Word ${sp.i+1} / ${sp.list.length}</span>
      ${hasPic(w)?pic(w,130):`<div style="font-size:64px">✏️</div>`}
      ${S.showThai?`<div class="thai" style="font-size:20px;font-weight:600;color:var(--ink2)">${esc(w.th||'')}</div>`:''}
      <div class="row g8 wrap center">
        <button class="btn sm" data-act="say" data-t="${esc(w.w)}" data-r="0.75">🔊 Listen</button>
        <button class="btn sm ghost" data-act="say" data-t="${esc(w.w)}" data-r="0.5">🐢 Slow</button>
      </div>
      ${w.s?`<button class="soft" style="padding:9px 12px;width:100%;font-size:15.5px" data-act="say" data-t="${esc(w.s)}">🗣️ ${esc(w.s)}</button>`:''}
      ${w.note?`<div class="hint">${esc(w.note)}</div>`:''}
    </div>
    <div class="card f1 col g14" style="align-items:center;justify-content:center">
      <div class="row center wrap" style="gap:6px;min-height:80px">${slots}</div>
      <div class="msg tc" style="color:${sp.checked?(allOk?'var(--ok)':'var(--bad)'):'var(--ink3)'}">
        ${sp.checked?(allOk?'✔ Correct! สะกดถูกทุกตัว':'✘ ยังไม่ถูก — คำที่ถูกคือ <b style="letter-spacing:1px">'+esc(w.w)+'</b>'):'<span class="hint">ฟังคำ แล้วแตะตัวอักษรทีละตัว (ช่องว่างข้ามให้อัตโนมัติ)</span>'}</div>
      <div class="kbd">${rows.map(r=>`<div class="krow">${r.split('').map(ch=>`<button class="key" data-act="spkey" data-k="${ch}">${ch}</button>`).join('')}</div>`).join('')}
        <div class="krow">
          <button class="key wide" data-act="spdel">⌫ Delete</button>
          <button class="key wide" data-act="sphint">💡 Hint</button>
          ${sp.checked&&!allOk?`<button class="key wide" data-act="spretry">↺ Try again</button>`:''}
          ${sp.checked?`<button class="btn" data-act="spnext">${sp.i===sp.list.length-1?'Finish ✓':'Next word ▶'}</button>`
            :`<button class="btn" data-act="spcheck" ${sp.typed.length<n?'disabled style="opacity:.45"':''}>Check ✓</button>`}
        </div></div>
      <div class="hint">ถูกแล้ว ${sp.right} คำ · ใช้คำใบ้ ${sp.hints} ครั้ง</div>
    </div></div>`;
};
ACT.spkey=d=>{ const sp=S.sp; if(sp.checked) return; const n=spTarget().replace(/ /g,'').length;
  if(sp.typed.length<n){ sp.typed.push(d.k); render(); } };
ACT.spdel=()=>{ const sp=S.sp; if(sp.checked) return; sp.typed.pop(); render(); };
ACT.sphint=()=>{ const sp=S.sp; if(sp.checked) return; const L=spTarget().replace(/ /g,'');
  let k=0; while(k<sp.typed.length && sp.typed[k]===L[k]) k++;
  sp.typed=sp.typed.slice(0,k); if(k<L.length){ sp.typed.push(L[k]); sp.hints++; } render(); };
ACT.spcheck=()=>{ const sp=S.sp, L=spTarget().replace(/ /g,''); if(sp.typed.length<L.length) return;
  sp.checked=true; const ok=sp.typed.join('')===L; const w=sp.list[sp.i];
  record(w.id?w:null,'spell',ok); if(ok){ sp.right++; star(2); Voice.say('Yes! '+w.w,.8); } else ACT.spellout({w:w.w});
  render(); };
ACT.spretry=()=>{ const sp=S.sp, L=spTarget().replace(/ /g,''); let k=0; while(k<sp.typed.length&&sp.typed[k]===L[k]) k++;
  sp.typed=sp.typed.slice(0,k); sp.checked=null; render(); };
ACT.spnext=()=>{ const sp=S.sp;
  if(sp.i<sp.list.length-1){ sp.i++; sp.typed=[]; sp.checked=null; render(); setTimeout(()=>Voice.say(sp.list[sp.i].w,.75),250); }
  else { const total=sp.list.length; Voice.say(sp.right===total?'Perfect spelling!':'Good job!',.85);
    if(sp.right===total) star(3); go(sp.back||'spelling'); } };

          <span style="font-size:26px;font-weight:700;color:var(--ok)">${esc(m.right)}</span>
          <span class="hint" style="font-size:12.5px">${esc(m.note)}</span></span></button>`).join('')}
    </div>
  </div>
  <div class="card col g10" style="margin-top:14px;border-top:6px solid var(--gold)">
    <div class="row g10"><div style="font-size:30px">🐛</div><div class="col f1">

    <div class="row wrap g8">${trickyWords.map(w=>`<button class="chip row g6" data-act="spellout" data-w="${esc(w.w)}" style="display:flex">${pic(w,26)}<span>${esc(w.w)}</span></button>`).join('')}</div>
  </div>
  <div class="row g8" style="margin:16px 0 8px"><div class="eyebrow">Spell by unit · สะกดคำทีละ Unit</div></div>
  <div class="hubgrid" data-rg="4" style="grid-template-columns:repeat(4,1fr)">
    ${UNITS.map(u=>hcard({act:'unitspell',k:u.key,ic:u.words.find(w=>w.e).e,title:'Unit '+u.n,sub:u.title,c:u.c})).join('')}
  </div>

    ${hcard({act:'unitspell',k:'colours',ic:'🎨',title:'Colours · Numbers · Days',sub:'สะกดคำเสริมที่ใช้บ่อยในข้อสอบ',c:'pink'})}

};

/* ═════════════════════════════════════════════════════════════════════
   6G. MEMORY MATCH — จับคู่ภาพกับคำ
   ═════════════════════════════════════════════════════════════════════ */
function startMemory(setKey,section,back){
  const set=SETBY[setKey];
  const ws=pickN(set.words.filter(w=>set.noPic||hasPic(w)),6);
  const cards=shuffle(ws.flatMap((w,i)=>[{id:i,kind:'a',w},{id:i,kind:'b',w}]));
  S.mem={set:setKey,cards,open:[],done:{},moves:0,section,back};
  Voice.stop(); S.screen='memory'; render();
}
VIEWS.memory = ()=>{
  const m=S.mem, set=SETBY[m.set], col=C(set.c);
  const won=Object.keys(m.done).length===m.cards.length/2;
  return `<div class="row g10 f0" style="margin-bottom:10px">
      <span class="tag" style="background:#EEF2F8;color:var(--ink2);font-size:14px">Moves ${m.moves}</span>
      <span class="tag" style="background:var(--ok-t);color:var(--ok);font-size:14px">Pairs ${Object.keys(m.done).length} / ${m.cards.length/2}</span>
      <span class="hint">แตะการ์ด 2 ใบ หาคู่ ${set.noPic?'คำ กับ ความหมาย':'ภาพ กับ คำ'}</span><span class="spacer"></span>
      <button class="btn sm ghost" data-act="memnew">↺ New game</button></div>
    <div class="f1 memgrid" data-rg="4" style="display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:12px;min-height:0">
      ${m.cards.map((c,i)=>{ const up=m.open.includes(i)||m.done[c.id]; return `
        <button class="mem ${up?'':'down'} ${m.done[c.id]?'done':''}" data-act="memflip" data-i="${i}" style="${up?'border-color:'+col:''}">
          ${!up?`<span style="font-size:34px;opacity:.9">⭐</span>`
            : c.kind==='a' ? (set.noPic?`<span class="thai" style="font-size:20px;padding:6px;text-align:center">${esc(c.w.th)}</span>`:pic(c.w,84))
            : `<span style="font-size:${c.w.w.length>11?20:26}px;padding:6px;text-align:center">${esc(c.w.w)}</span>`}
        </button>`; }).join('')}
    </div>
    ${won?`<div class="sheet" style="position:absolute;background:rgba(30,53,87,.25)"><div class="card col g10 center pop" style="padding:28px 40px;text-align:center">
      <div style="font-size:64px">🎉</div><div style="font-size:28px;font-weight:700">All pairs found!</div>
      <div class="hint">ใช้ ${m.moves} ครั้ง</div>
      <div class="row g10"><button class="btn" data-act="memnew">Play again</button><button class="btn ghost" data-act="nav" data-k="${m.back}">Done</button></div></div></div>`:''}`;
};
ACT.memnew=()=>startMemory(S.mem.set,S.mem.section,S.mem.back);
ACT.memflip=d=>{
  const m=S.mem, i=+d.i, c=m.cards[i];
  if(m.done[c.id]||m.open.includes(i)||m.open.length>=2) return;
  m.open.push(i);
  if(c.kind==='b'||SETBY[m.set].noPic) Voice.say(c.w.w,.8);
  if(m.open.length===2){
    m.moves++;
    const [a,b]=m.open.map(k=>m.cards[k]);
    if(a.id===b.id){ m.done[a.id]=true; m.open=[]; record(a.w,'pic',true); star(1);
      if(Object.keys(m.done).length===m.cards.length/2){ star(3); setTimeout(()=>Voice.say('Well done!',.85),400); } }
    else setTimeout(()=>{ m.open=[]; if(S.screen==='memory') render(); },950);
  }
  render();
};
